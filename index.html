async function shareInvoicePDF(invoiceId){
  const i=(db.invoices||[]).find(x=>String(x.id)===String(invoiceId));
  if(!i){alert("Invoice not found.");return;}
  const c=(db.customers||[]).find(x=>String(x.id)===String(i.customerId))||{};
  const name=c.name||"Customer";
  const studio=db.settings?.studio||"RK Studio";
  const remaining=Math.max(0,Number(i.total||0)-Number(i.paid||0));
  const defaultMsg=`Hello ${name},\n\nPlease find your invoice ${i.number||""} from ${studio}.\n\nTotal Amount: ${money(i.total)}\nPaid Amount: ${money(i.paid)}\nRemaining Amount: ${money(remaining)}${i.dueDate?`\nDue Date: ${i.dueDate}`:""}\n\nPlease review the invoice details and payment schedule.\n\nThank you,\n${studio}`;

  const overlay=document.createElement("div");
  overlay.className="wa-custom-overlay";
  overlay.innerHTML=`<div class="wa-custom-box">
    <div class="wa-custom-head">
      <div><h2>📄 Send Invoice PDF on WhatsApp</h2><p>PDF bhi generate hoga aur message aap send karne se pehle edit kar sakte hain.</p></div>
      <button type="button" class="wa-close">×</button>
    </div>
    <div class="wa-summary"><b>${esc(name)}</b><span>${esc(i.number||"")}</span></div>
    <label class="wa-label">Custom WhatsApp Message</label>
    <textarea class="wa-message" rows="11"></textarea>
    <div class="wa-custom-actions">
      <button type="button" class="secondary wa-cancel">Cancel</button>
      <button type="button" class="btn wa-send">📱 Generate PDF & Send</button>
    </div>
    <div class="muted" style="margin-top:9px;font-size:11px">Mobile browsers that support file sharing can attach the PDF directly in WhatsApp. On other browsers, the PDF will download and WhatsApp will open with your message.</div>
  </div>`;
  document.body.appendChild(overlay);
  const ta=overlay.querySelector(".wa-message"); ta.value=defaultMsg; ta.focus();
  const close=()=>overlay.remove();
  overlay.querySelector(".wa-close").onclick=close;
  overlay.querySelector(".wa-cancel").onclick=close;
  overlay.addEventListener("click",e=>{if(e.target===overlay)close();});
  overlay.querySelector(".wa-send").onclick=async()=>{
    const msg=ta.value.trim();
    if(!msg){alert("Please enter a message.");ta.focus();return;}
    const phone=(c.phone||"").replace(/\D/g,"");
    if(!phone){alert("Customer phone number not available.");return;}
    const btn=overlay.querySelector(".wa-send");
    btn.disabled=true; btn.textContent="⏳ Creating PDF...";
    try{
      const pdfBlob=await rkCreateInvoicePDFBlob(invoiceId);
      const safeNumber=String(i.number||invoiceId).replace(/[^a-z0-9_-]/gi,"-");
      const file=new File([pdfBlob],`Invoice-${safeNumber}.pdf`,{type:"application/pdf"});
      const intl=phone.length===10?"91"+phone:phone;
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({title:`Invoice ${i.number||""} — ${studio}`,text:msg,files:[file]});
        close();
        return;
      }
      const a=document.createElement("a");
      a.href=URL.createObjectURL(pdfBlob); a.download=file.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1500);
      window.open("https://wa.me/"+intl+"?text="+encodeURIComponent(msg),"_blank");
      close();
    }catch(e){
      console.error(e);
      btn.disabled=false; btn.textContent="📱 Generate PDF & Send";
      alert("PDF share nahi ho paya. Pehle PDF download karke WhatsApp se attach kar sakte hain.");
    }
  };
}

async function rkCreateInvoicePDFBlob(invoiceId){
  const source=document.querySelector('#invoices .invoice');
  if(!source) throw new Error('Invoice is not open.');
  if(!window.html2canvas || !window.jspdf) throw new Error('PDF libraries not loaded');

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});
  const pageW=210, pageH=297, margin=10;
  const usableW=pageW-margin*2, usableH=pageH-margin*2;
  let hasPage=false;

  function cleanup(root){
    root.querySelectorAll(
      '.invoice-actions,.invoice-toolbar,.invoice-controls,.invoice-view-actions,'+
      '.invoice-top-actions,.invoice-action-bar,.print-hide,button'
    ).forEach(x=>x.remove());
    root.querySelectorAll('a[href]').forEach(a=>a.removeAttribute('href'));
  }

  function makeHolder(){
    const h=document.createElement('div');
    h.style.cssText=[
      'position:fixed','left:-100000px','top:0','width:794px',
      'background:#fff','color:#111','margin:0','padding:0','z-index:-1',
      'font-family:Arial,sans-serif'
    ].join(';');
    document.body.appendChild(h);
    return h;
  }

  // Remove trailing canvas whitespace so a tiny overflow does not create
  // a visually blank A4 page.
  function trimCanvas(canvas){
    const ctx=canvas.getContext('2d');
    const {width,height}=canvas;
    const data=ctx.getImageData(0,0,width,height).data;
    let top=height, bottom=-1, left=width, right=-1;
    const threshold=248; // treat near-white as page background
    for(let y=0;y<height;y+=2){
      for(let x=0;x<width;x+=2){
        const p=(y*width+x)*4;
        const a=data[p+3];
        if(a>0 && (data[p]<threshold || data[p+1]<threshold || data[p+2]<threshold)){
          if(y<top) top=y;
          if(y>bottom) bottom=y;
          if(x<left) left=x;
          if(x>right) right=x;
        }
      }
    }
    if(bottom<0) return canvas;
    const pad=8;
    top=Math.max(0,top-pad);
    bottom=Math.min(height-1,bottom+pad);
    left=Math.max(0,left-pad);
    right=Math.min(width-1,right+pad);
    const out=document.createElement('canvas');
    out.width=right-left+1;
    out.height=bottom-top+1;
    out.getContext('2d').drawImage(canvas,left,top,out.width,out.height,0,0,out.width,out.height);
    return out;
  }

  function getSafeCuts(root){
    const cuts=new Set([0]);
    const top=root.getBoundingClientRect().top;
    const selectors=[
      ':scope > *','tr','.invoice-package-block','.invoice-shoot-row',
      '.invoice-deliverables-block','.invoice-term','.invoice-terms-intro',
      '.payment-structure > *','.invoice-terms > *'
    ];
    selectors.forEach(sel=>{
      try{
        root.querySelectorAll(sel).forEach(el=>{
          const r=el.getBoundingClientRect();
          if(r.width>0 && r.height>0) cuts.add(Math.round((r.bottom-top)*2));
        });
      }catch(e){}
    });
    return [...cuts].filter(v=>v>0).sort((a,b)=>a-b);
  }

  function addCanvasPages(rawCanvas,cuts){
    const canvas=trimCanvas(rawCanvas);
    const maxPx=Math.max(1,Math.floor((usableH/usableW)*canvas.width));
    let y=0;

    while(y<canvas.height-4){
      const target=Math.min(canvas.height,y+maxPx);
      let cut=cuts.filter(v=>v>y+12 && v<=target).pop();
      if(!cut || cut<=y) cut=target;
      cut=Math.min(cut,canvas.height);

      if(hasPage) pdf.addPage();
      hasPage=true;

      const sliceH=Math.max(1,cut-y);
      const slice=document.createElement('canvas');
      slice.width=canvas.width;
      slice.height=Math.ceil(sliceH);

      const ctx=slice.getContext('2d');
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,slice.width,slice.height);
      ctx.drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);

      const img=slice.toDataURL('image/jpeg',0.96);
      const mmH=(slice.height*usableW)/canvas.width;
      pdf.addImage(img,'JPEG',margin,margin,usableW,mmH,undefined,'FAST');

      y=cut;
    }
  }

  async function renderNode(node){
    const holder=makeHolder();
    const clone=node.cloneNode(true);
    cleanup(clone);
    clone.style.cssText=[
      'width:794px','max-width:794px','background:#fff','color:#111',
      'margin:0','padding:0','box-sizing:border-box'
    ].join(';');
    holder.appendChild(clone);
    try{
      const canvas=await html2canvas(clone,{
        scale:2,useCORS:true,backgroundColor:'#fff',
        logging:false,windowWidth:794,imageTimeout:15000
      });
      addCanvasPages(canvas,getSafeCuts(clone));
    }finally{
      holder.remove();
    }
  }

  // Main invoice: identical content to Print / Save PDF, excluding only
  // Payment Structure and the Agreement so they can begin cleanly on the
  // following page without creating an empty overflow page.
  const main=source.cloneNode(true);
  main.querySelectorAll('.payment-structure,.invoice-terms').forEach(x=>x.remove());
  await renderNode(main);

  // These are real invoice sections; Agreement may be outside .invoice.
  const payment=source.querySelector('.payment-structure') ||
                document.querySelector('#invoices .payment-structure');
  const terms=document.querySelector('#invoices .invoice-terms') ||
              source.querySelector('.invoice-terms');

  const tail=document.createElement('div');
  tail.style.cssText='width:794px;background:#fff;color:#111;margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;';

  if(payment){
    const p=payment.cloneNode(true);
    p.style.cssText+=';margin:0 0 14px 0!important;box-sizing:border-box;width:100%;';
    tail.appendChild(p);
  }
  if(terms){
    const a=terms.cloneNode(true);
    a.style.cssText+=';margin:0!important;box-sizing:border-box;width:100%;';
    tail.appendChild(a);
  }

  if(payment || terms) await renderNode(tail);

  if(!hasPage) throw new Error('Invoice PDF contains no renderable content.');
  return pdf.output('blob');
}

function rkGlobalSearch(query){
  const q=String(query||"").trim().toLowerCase();
  const box=document.getElementById("rkSearchResults");
  if(!box)return;
  if(!q){box.innerHTML="";box.classList.remove("show");return;}
  const results=[];
  (db.customers||[]).forEach(c=>{if(`${c.name} ${c.phone} ${c.venue} ${c.package}`.toLowerCase().includes(q))results.push({type:"Customer",name:c.name,meta:c.phone||c.venue||"",action:()=>renderCustomerCRM(c.id)});});
  (db.invoices||[]).forEach(i=>{if(`${i.number} ${customerName(i.customerId)}`.toLowerCase().includes(q))results.push({type:"Invoice",name:i.number,meta:customerName(i.customerId),action:()=>openInvoiceFromAnywhere(i.id)});});
  (db.events||[]).forEach(e=>{if(`${e.name} ${customerName(e.customerId)} ${e.venue}`.toLowerCase().includes(q))results.push({type:"Shoot",name:e.name,meta:`${customerName(e.customerId)} · ${e.date}`,action:()=>openEvent(e.id)});});
  if(!results.length){box.innerHTML='<div class="search-empty">No results found</div>';box.classList.add("show");return;}
  box.innerHTML=results.slice(0,10).map((r,idx)=>`<button class="search-result" onclick="rkSearchPick(${idx})"><span class="search-type">${esc(r.type)}</span><span><b>${esc(r.name)}</b><small>${esc(r.meta)}</small></span></button>`).join("");
  window._rkSearchResults=results.slice(0,10);
  box.classList.add("show");
}
function rkSearchPick(idx){
  const r=window._rkSearchResults?.[idx]; if(!r)return;
  document.getElementById("rkSearchInput").value="";
  const box=document.getElementById("rkSearchResults"); if(box)box.classList.remove("show");
  r.action();
}

  return rows;
}

      unit_price:Number(x.unit_price??x.rate??x.price??0),
      amount:Number(x.amount??x.total??((Number(x.quantity||x.qty||1))*(Number(x.unit_price??x.rate??x.price??0)))),
      sort_order:idx,
      custom_data:x
    }));
  };
  
  const paymentToRow=p=>({id:String(p.id),invoice_id:p.invoiceId?String(p.invoiceId):null,customer_id:p.customerId?String(p.customerId):null,date:p.date||null,amount:Number(p.amount||0),method:p.method||null,note:p.note||null,media_path:Array.isArray(p.media)?JSON.stringify(p.media.map(x=>x.path||x.url||'').filter(Boolean)):null,created_by:null});
  const rowToPayment=r=>{let media=[];try{media=r.media_path?JSON.parse(r.media_path):[]}catch(e){media=[]}return {id:String(r.id),date:r.date||'',amount:Number(r.amount||0),invoiceId:r.invoice_id?String(r.invoice_id):'',customerId:r.customer_id?String(r.customer_id):'',method:r.method||'Other',note:r.note||'Payment received',media:media.map(path=>({path}))}};
  const expenseToRow=e=>({id:String(e.id),customer_id:e.customerId?String(e.customerId):null,category:e.category||null,amount:Number(e.amount||0),date:e.date||null,description:e.description||'',created_by:null});
  const rowToExpense=r=>({id:String(r.id),date:r.date||'',customerId:r.customer_id?String(r.customer_id):'',category:r.category||'',amount:Number(r.amount||0),description:r.description||'',note:''});
  function rkCloudActivityUuid(value){
    const s=String(value||'');
    if(/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(s))return s;
    let h1=2166136261,h2=2166136261,h3=2166136261,h4=2166136261;
    for(let i=0;i<s.length;i++){
      const c=s.charCodeAt(i);
      h1=Math.imul(h1^c,16777619)>>>0;
      h2=Math.imul(h2^(c+(i<<1)),16777619)>>>0;
      h3=Math.imul(h3^(c+(i<<2)),16777619)>>>0;
      h4=Math.imul(h4^(c+(i<<3)),16777619)>>>0;
    }
    const hex=[h1,h2,h3,h4].map(x=>x.toString(16).padStart(8,'0')).join('');
    return hex.slice(0,8)+'-'+hex.slice(8,12)+'-4'+hex.slice(13,16)+'-'+
      ((parseInt(hex.slice(16,18),16)&0x3f)|0x80).toString(16).padStart(2,'0')+
      hex.slice(18,20)+'-'+hex.slice(20,32);
  }
  const logToRow=x=>{
    const fingerprint=[
      x.id||'',
      x.at||x.createdAt||'',
      x.type||'System',
      x.action||'',
      x.detail||'',
      x.entityId||''
    ].join('|');
    return {
      id:rkCloudActivityUuid(fingerprint),
      type:x.type||'System',
      action:x.action||'',
      detail:x.detail||'',
      entity_type:x.entityType||null,
      entity_id:x.entityId||null,
      user_id:null,
      created_at:x.at||x.createdAt||new Date().toISOString()
    };
  };
  const rowToLog=r=>({id:String(r.id),type:r.type||'System',action:r.action||'',detail:r.detail||'',entityId:r.entity_id||'',userId:r.user_id||'',user:r.user||'Cloud',at:r.created_at||new Date().toISOString()});

  function localRows(table){
    const notDeleted=(name,rows)=>rows.filter(r=>!rkIsCloudDeleted(name,r.id));
    if(table.name==='customers')return notDeleted('customers',(db.customers||[]).map(customerToRow));
    if(table.name==='shoots')return notDeleted('shoots',(db.events||[]).map(shootToRow));
    if(table.name==='packages')return notDeleted('packages',(db.packages||[]).map(packageToRow));
    if(table.name==='invoices')return notDeleted('invoices',(db.invoices||[]).map(invoiceToRow));
    if(table.name==='invoice_items')return (db.invoices||[]).flatMap(invoiceItemsToRows);
    if(table.name==='payments')return notDeleted('payments',(db.payments||[]).map(paymentToRow));
    if(table.name==='expenses')return notDeleted('expenses',(db.expenses||[]).map(expenseToRow));
    if(table.name==='activity_logs'){
      const rows=[];
      const seen=new Set();
      for(const x of (db.activityLog||[])){
        const row=logToRow(x);
        if(seen.has(row.id))continue;
        seen.add(row.id);
        rows.push(row);
      }
      return rows;
    }
    return [];
  }
  function remoteToLocal(table,rows){
    if(table.name==='customers')return rows.map(rowToCustomer);
    if(table.name==='shoots')return rows.map(rowToShoot);
    if(table.name==='packages')return rows.map(rowToPackage);
    if(table.name==='invoices'){
      const localById=new Map((db.invoices||[]).map(x=>[String(x.id),x]));
      return rows.map(r=>rowToInvoice(r,localById.get(String(r.id))));
    }
    if(table.name==='payments')return rows.map(rowToPayment);
    if(table.name==='expenses')return rows.map(rowToExpense);
    if(table.name==='activity_logs')return rows.map(rowToLog);
    return [];
  }
  async function authUserId(){
    try{const {data}=await cloud().auth.getUser();return data?.user?.id||null}catch(e){return null}
  }
  async function push(table){
    let rows=localRows(table);
    if(!rows.length)return {count:0};
    const uid=await authUserId();
    if((table.name==='payments'||table.name==='expenses'||table.name==='activity_logs')&&uid){
      rows=rows.map(x=>({...x,...(table.name==='activity_logs'?{user_id:uid}:{created_by:uid})}));
    }
    const {error}=await cloud().from(table.name).upsert(rows,{onConflict:'id'});
    if(error)throw new Error(`${table.name}: ${error.message||JSON.stringify(error)}`);
    return {count:rows.length};
  }
  async function hydrateTable(table){
    const {data,error}=await cloud().from(table.name).select('*');
    if(error)throw error;
    const remote=data||[];
    if(table.name==='customers')db.customers=remoteToLocal(table,remote);
    if(table.name==='shoots')db.events=remoteToLocal(table,remote);
    if(table.name==='packages')db.packages=remoteToLocal(table,remote);
    if(table.name==='invoices')db.invoices=remoteToLocal(table,remote);
    if(table.name==='payments')db.payments=remoteToLocal(table,remote);
    if(table.name==='expenses')db.expenses=remoteToLocal(table,remote);
    if(table.name==='activity_logs')db.activityLog=remoteToLocal(table,remote);
  }
  async function hydrate(){
    if(!cloudSession())return false;
    status('syncing','Loading cloud data…');
    for(const table of CLOUD_TABLES){
      try{await hydrateTable(table)}
      catch(e){
        const msg=e.message||String(e);
        console.error('Cloud hydrate failed for',table.name,e);
        status('local',`Cloud load failed: ${msg}`);
        window.RK_CLOUD_LAST_ERROR=msg;
        return false;
      }
    }
    if(!RK_SERVER_ONLY) localStorage.setItem(KEY,JSON.stringify(db)); if(typeof render==='function')render();
    status('synced','Cloud data loaded.'); window.RK_CLOUD_LAST_ERROR=''; return true;
  }
  const dirtyQueue=new Map();
  function markDirty(tableName,ids){
    if(!cloudSession()||!ids)return;
    const key=String(tableName), set=dirtyQueue.get(key)||new Set();
    (Array.isArray(ids)?ids:[ids]).forEach(id=>{if(id!==undefined&&id!==null&&String(id)!=='')set.add(String(id));});
    if(set.size)dirtyQueue.set(key,set);
    if(window.rkCloudScheduleSave) window.rkCloudScheduleSave();
  }
  window.rkCloudMarkDirty=markDirty;

  async function push(table,onlyIds=null){
    let rows=localRows(table);
    if(onlyIds && onlyIds.size) rows=rows.filter(x=>onlyIds.has(String(x.id)));
    if(!rows.length)return {count:0};
    const uid=await authUserId();
    if((table.name==='payments'||table.name==='expenses'||table.name==='activity_logs')&&uid){
      rows=rows.map(x=>({...x,...(table.name==='activity_logs'?{user_id:uid}:{created_by:uid})}));
    }
    const {error}=await cloud().from(table.name).upsert(rows,{onConflict:'id'});
    if(error)throw new Error(`${table.name}: ${error.message||JSON.stringify(error)}`);
    return {count:rows.length};
  }

  async function syncNow(){
    if(running||!cloudSession())return; running=true;
    try{
      const entries=[...dirtyQueue.entries()];
      if(!entries.length){status('synced','Cloud synced');window.RK_CLOUD_LAST_ERROR='';return;}
      status('syncing','Saving to Supabase…');
      const failures=[];
      for(const [tableName,ids] of entries){
        const table=CLOUD_TABLES.find(x=>x.name===tableName);
        if(!table){dirtyQueue.delete(tableName);continue;}
        try{
          await push(table,ids);
          dirtyQueue.delete(tableName);
        }catch(e){
          console.error('Cloud sync failed for',table.name,e);
          failures.push(e.message||String(e));
        }
      }
      if(failures.length){
        status('local',`Cloud sync needs attention: ${failures[0]}`);
        window.RK_CLOUD_LAST_ERROR=failures.join(' | ');
      }else{
        status('synced','Cloud synced');
        window.RK_CLOUD_LAST_ERROR='';
      }
    }finally{running=false}
  }
  window.rkCloudScheduleSave=()=>{if(!cloudSession())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,450)};
  window.rkCloudSyncPhase3=syncNow; window.rkCloudHydratePhase3=hydrate;

  function subscribe(tableName){
    if(!cloudSession())return;
    const ch=cloud().channel('rk-v139-'+tableName).on('postgres_changes',{event:'*',schema:'public',table:tableName},payload=>{
      try{
        const upsert=(arr,obj)=>{const i=arr.findIndex(x=>String(x.id)===String(obj.id));if(i>=0)arr[i]=obj;else arr.push(obj)};
        if(tableName==='studio_settings'){
          if(payload.eventType==='DELETE') db.settings={studio:'RK Studio',phone:'',address:''};
          else if(typeof rowToSettings==='function') db.settings=rowToSettings(payload.new);
          if(typeof applyUI==='function')applyUI();
          if(typeof renderSettings==='function' && !document.getElementById('settings')?.classList.contains('hidden'))renderSettings();
        }
        if(tableName==='customers'){if(payload.eventType==='DELETE')db.customers=db.customers.filter(x=>String(x.id)!==String(payload.old.id));else upsert(db.customers,rowToCustomer(payload.new))}
        if(tableName==='shoots'){if(payload.eventType==='DELETE')db.events=db.events.filter(x=>String(x.id)!==String(payload.old.id));else upsert(db.events,rowToShoot(payload.new))}
        if(tableName==='packages'){if(payload.eventType==='DELETE')db.packages=db.packages.filter(x=>String(x.id)!==String(payload.old.id));else upsert(db.packages,rowToPackage(payload.new))}
        if(tableName==='invoices'){if(payload.eventType==='DELETE')db.invoices=db.invoices.filter(x=>String(x.id)!==String(payload.old.id));else upsert(db.invoices,rowToInvoice(payload.new))}
        if(tableName==='payments'){if(payload.eventType==='DELETE')db.payments=db.payments.filter(x=>String(x.id)!==String(payload.old.id));else upsert(db.payments,rowToPayment(payload.new))}
        if(tableName==='expenses'){if(payload.eventType==='DELETE')db.expenses=db.expenses.filter(x=>String(x.id)!==String(payload.old.id));else upsert(db.expenses,rowToExpense(payload.new))}
        if(tableName==='activity_logs'){if(payload.eventType==='DELETE')db.activityLog=db.activityLog.filter(x=>String(x.id)!==String(payload.old.id));else upsert(db.activityLog,rowToLog(payload.new))}
        if(!RK_SERVER_ONLY) localStorage.setItem(KEY,JSON.stringify(db));
        // Never rebuild the whole app from a background Realtime event.
        // Re-rendering here can move focus, scroll and transient UI on every page.
      }catch(e){console.warn('Realtime update skipped',e)}
    }).subscribe();
    subscriptions.push(ch);
  }
  function startRealtime(){
    subscriptions.forEach(c=>{try{cloud().removeChannel(c)}catch(e){}});subscriptions=[];
    CLOUD_TABLES.forEach(x=>subscribe(x.name));
    subscribe('studio_settings');
  }
  window.rkCloudStartRealtimePhase3=startRealtime;
  setTimeout(async()=>{if(cloudSession()){try{await hydrate();startRealtime()}catch(e){console.warn('Cloud bootstrap skipped',e);status('local','Cloud bootstrap failed')}}},900);
})();
</script>

<script id="rk-v140-cloud-migration">
(function(){
  const MIG_KEY='rkStudioCloudMigrationV1';

  function cloud(){return window.RK_SUPABASE}
  function isCloud(){return !!cloud() && sessionStorage.getItem('rkStudioAuthProvider')==='supabase'}
  function setMsg(text,type='info'){
    const box=document.getElementById('rkMigrationMessage');
    if(!box)return;
    box.textContent=text;
    box.dataset.type=type;
  }
  function counts(){
    return {
      customers:(db.customers||[]).length,
      shoots:(db.events||[]).length,
      packages:(db.packages||[]).length,
      invoices:(db.invoices||[]).length,
      payments:(db.payments||[]).length,
      expenses:(db.expenses||[]).length,
      activity:(db.activityLog||[]).length,
      users:(db.users||[]).length
    };
  }
  function renderCounts(){
    const c=counts();
    const el=document.getElementById('rkMigrationCounts');
    if(!el)return;
    el.innerHTML=Object.entries(c).map(([k,v])=>`<span class="rk-migration-count"><b>${v}</b> ${k}</span>`).join('');
  }

  function toCustomer(c){
    return {id:String(c.id),name:String(c.name||''),phone:c.phone||null,email:c.email||null,address:c.address||null,notes:c.notes||null,photo_path:null,custom_data:{weddingDate:c.weddingDate||'',venue:c.venue||'',package:c.package||'',photo:c.photo||''}};
  }
  function toShoot(e){
    return {id:String(e.id),customer_id:e.customerId?String(e.customerId):null,name:e.name||'',event_type:e.name||'',date:e.date||null,start_time:e.time||null,location:e.venue||'',status:e.status||'Planned',team:e.team||'',requirements:'',notes:e.notes||'',custom_data:{}};
  }
  function toPackage(p){
    return {id:String(p.id),name:String(p.name||''),price:Number(p.price||0),items:Array.isArray(p.items)?p.items:[],active:p.active!==false};
  }
  function toInvoice(i){
    return {id:String(i.id),customer_id:i.customerId?String(i.customerId):null,invoice_number:i.number||'',invoice_date:i.date||null,due_date:i.dueDate||null,status:i.status||null,subtotal:Number(i.subtotal||i.total||0),total:Number(i.total||0),paid:Number(i.paid||0),remaining:Math.max(0,Number(i.total||0)-Number(i.paid||0)),notes:i.notes||null,terms:i.terms||null,package_id:i.packageId?String(i.packageId):null,deliverables:i.deliverables||{},custom_data:{items:Array.isArray(i.items)?i.items:[]}};
  }
  function toPayment(p,uid){
    const media=(p.media||[]).map(x=>x?.path).filter(Boolean);
    return {id:String(p.id),invoice_id:p.invoiceId?String(p.invoiceId):null,customer_id:p.customerId?String(p.customerId):null,date:p.date||null,amount:Number(p.amount||0),method:p.method||null,note:p.note||null,media_path:media.length?JSON.stringify(media):null,created_by:uid||null};
  }
  function toExpense(e,uid){
    return {id:String(e.id),customer_id:e.customerId?String(e.customerId):null,category:e.category||null,amount:Number(e.amount||0),date:e.date||null,description:e.description||'',created_by:uid||null};
  }
  function rkDeterministicUuid(input){
    // Stable UUID-shaped ID for legacy localStorage activity IDs such as
    // "logmtztlcatcinuc". Keeps repeated migrations idempotent.
    let h1=2166136261,h2=2166136261,h3=2166136261,h4=2166136261;
    const s=String(input||'');
    for(let i=0;i<s.length;i++){
      const c=s.charCodeAt(i);
      h1=Math.imul(h1^c,16777619)>>>0;
      h2=Math.imul(h2^(c+(i<<1)),16777619)>>>0;
      h3=Math.imul(h3^(c+(i<<2)),16777619)>>>0;
      h4=Math.imul(h4^(c+(i<<3)),16777619)>>>0;
    }
    const hex=[h1,h2,h3,h4].map(x=>x.toString(16).padStart(8,'0')).join('');
    return hex.slice(0,8)+'-'+hex.slice(8,12)+'-4'+hex.slice(13,16)+'-'+
      ((parseInt(hex.slice(16,18),16)&0x3f)|0x80).toString(16).padStart(2,'0')+
      hex.slice(18,20)+'-'+hex.slice(20,32);
  }
  function toLog(x,uid){
    const legacyId=String(x.id||'');
    // Old browser activity IDs are not guaranteed unique. Build the cloud UUID
    // from the ID + event content so two different legacy rows never collapse
    // into the same upsert key.
    const fingerprint=[
      legacyId,
      x.at||x.createdAt||'',
      x.type||'System',
      x.action||'',
      x.detail||'',
      x.entityId||''
    ].join('|');
    return {
      id:rkDeterministicUuid(fingerprint),
      type:x.type||'System',action:x.action||'',detail:x.detail||'',
      entity_type:null,entity_id:String(x.entityId||legacyId||''),
      user_id:uid||null,created_at:x.at||x.createdAt||new Date().toISOString()
    };
  }

  async function uploadDataUrl(bucket,path,dataUrl){
    if(!dataUrl || !dataUrl.startsWith('data:'))return null;
    const blob=await (await fetch(dataUrl)).blob();
    const {error}=await cloud().storage.from(bucket).upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:true});
    if(error)throw error;
    return path;
  }

  async function migrateSettings(uid){
    const s=db.settings||{};
    let companyLogoPath=s.companyLogoPath||null;
    if(s.companyLogo && s.companyLogo.startsWith('data:')){
      companyLogoPath=await uploadDataUrl('studio-assets',`${uid}/company-logo.png`,s.companyLogo);
    }
    const row={
      id:true,studio_name:s.studio||'RK Studio',phone:s.phone||null,address:s.address||null,
      company_logo_path:companyLogoPath,
      primary_color:s.primary||null,secondary_color:s.secondary||null,background_color:s.background||null,
      card_color:s.cardColor||null,theme:s.theme==='dark'?'dark':'light',sidebar_style:s.sidebar==='light'?'light':'dark',
      sidebar_color:s.sidebarColor||null,compact:s.compact==='yes'?'yes':'no',sidebar_width:Number(s.sidebarWidth||245),
      radius:Number(s.radius||15),font_size:Number(s.fontSize||16),font_family:s.fontFamily||null,shadow:s.shadow||null,
      card_border:s.cardBorder||null,button_style:s.buttonStyle||null,welcome_enabled:true,
      welcome_title:s.welcomeTitle||null,welcome_message:s.welcomeMessage||null,
      whatsapp_templates:s.whatsappTemplates||{},extra_services:db.extraServices||[],custom_settings:s
    };
    const {error}=await cloud().from('studio_settings').upsert(row,{onConflict:'id'});
    if(error)throw error;
  }

  async function migrateProfile(uid){
    const local=(db.users||[]).find(u=>String(u.username||'').toLowerCase()===String(currentUser?.username||'').toLowerCase());
    const email=currentUser?.email||local?.email||null;
    if(!uid)return;
    const row={id:uid,username:currentUser?.username||local?.username||null,name:currentUser?.name||local?.name||'Administrator',role:currentUser?.role||local?.role||'admin',active:true,email};
    const {error}=await cloud().from('profiles').upsert(row,{onConflict:'id'});
    if(error)throw error;
  }

    function safeUuid(value){
    const s=String(value||'');
    if(/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(s))return s;
    if(typeof rkDeterministicUuid==='function')return rkDeterministicUuid(s);
    return (crypto?.randomUUID?.()||'00000000-0000-4000-8000-000000000000');
  }

  async function migrateCore(uid){
    // Core operational tables first. Activity logs are handled separately so a
    // legacy non-UUID log ID can never abort invoice/payment migration.
    const tables=[
      ['customers',(db.customers||[]).map(toCustomer)],
      ['shoots',(db.events||[]).map(toShoot)],
      ['packages',(db.packages||[]).map(toPackage)],
      ['invoices',(db.invoices||[]).map(toInvoice)],
      ['payments',(db.payments||[]).map(x=>toPayment(x,uid))],
      ['expenses',(db.expenses||[]).map(x=>toExpense(x,uid))]
    ];
    for(const [name,rows] of tables){
      if(!rows.length)continue;
      const {error}=await cloud().from(name).upsert(rows,{onConflict:'id'});
      if(error)throw new Error(name+': '+error.message);
    }

    const rawLogs=Array.isArray(db.activityLog)?db.activityLog:[];
    if(rawLogs.length){
      const activityRows=[];
      const seen=new Set();
      for(const x of rawLogs){
        const base=toLog(x,uid);
        const row={
          ...base,
          id:safeUuid(base.id),
          user_id:uid&&/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(uid))?uid:null
        };
        if(!seen.has(row.id)){
          seen.add(row.id);
          activityRows.push(row);
        }
      }
      const {error}=await cloud().from('activity_logs').upsert(activityRows,{onConflict:'id'});
      if(error)throw new Error('activity_logs: '+error.message);
    }
  }

  async function migratePaymentMedia(uid){
    const payments=db.payments||[];
    let uploaded=0,failed=0;
    for(const p of payments){
      const media=Array.isArray(p.media)?p.media:[];
      const paths=[];
      for(let i=0;i<media.length;i++){
        const m=media[i];
        if(m?.path){paths.push(m.path);continue;}
        if(!m?.data || !m.data.startsWith('data:'))continue;
        try{
          const path=await uploadDataUrl('payment-media',`${uid}/${p.invoiceId||'invoice'}/${p.id}-${i+1}.jpg`,m.data);
          if(path){paths.push(path);uploaded++;}
        }catch(e){failed++;console.warn('Payment media migration failed',p.id,e)}
      }
      if(paths.length){
        const {error}=await cloud().from('payments').update({media_path:JSON.stringify(paths)}).eq('id',String(p.id));
        if(error)failed++;
      }
    }
    return {uploaded,failed};
  }

  async function migrate(){
    if(typeof RK_SERVER_ONLY!=='undefined' && RK_SERVER_ONLY){
      setMsg('Server-only mode is active. No browser-to-cloud migration is required.','info');
      return;
    }
    if(!isCloud()){setMsg('Login with Supabase first.','error');return;}
    const btn=document.getElementById('rkMigrationRun');
    if(btn)btn.disabled=true;
    try{
      setMsg('Creating a cloud copy of your current RK Studio data…','info');
      const {data:au}=await cloud().auth.getUser();
      const uid=au?.user?.id;
      await migrateProfile(uid);
      await migrateSettings(uid);
      await migrateCore(uid);
      setMsg('Uploading payment screenshots…','info');
      const media=await migratePaymentMedia(uid);
      localStorage.setItem(MIG_KEY,JSON.stringify({completedAt:new Date().toISOString(),counts:counts(),media}));
      if(window.rkCloudHydratePhase3) await window.rkCloudHydratePhase3();
      setMsg(`Migration complete. ${media.uploaded} payment media file(s) uploaded${media.failed?`; ${media.failed} media file(s) need attention`:'.'}`,'success');
      renderCounts();
    }catch(e){
      console.error('RK Studio migration failed:',e);
      setMsg('Migration stopped: '+(e.message||e),'error');
    }finally{
      if(btn)btn.disabled=false;
    }
  }

  async function verify(){
    if(!isCloud()){setMsg('Login with Supabase first.','error');return;}
    try{
      const tables=['customers','shoots','packages','invoices','payments','expenses','activity_logs'];
      const result={};
      for(const name of tables){
        const {count,error}=await cloud().from(name).select('*',{count:'exact',head:true});
        if(error)throw error;
        result[name]=count||0;
      }
      const c=counts();
      const mismatch=[];
      const map={customers:'customers',shoots:'events',packages:'packages',invoices:'invoices',payments:'payments',expenses:'expenses',activity_logs:'activity'};
      for(const [remote,local] of Object.entries(map)){
        if(Number(result[remote])<Number(c[local]))mismatch.push(`${remote}: cloud ${result[remote]} / local ${c[local]}`);
      }
      setMsg(mismatch.length?'Cloud verification found differences: '+mismatch.join(' · '):'Cloud verification passed — local records are present in Supabase.','success');
    }catch(e){setMsg('Verification failed: '+(e.message||e),'error')}
  }

  window.rkRunCloudMigration=migrate;
  window.rkVerifyCloudMigration=verify;
  window.rkMigrationCounts=counts;

  function mount(){
    const root=document.getElementById('settings'); if(!root)return;
    if(root.querySelector('[data-rk-migration-panel]')){renderCounts();return}
    const card=document.createElement('div');
    card.className='card rk-migration-card';
    card.dataset.rkMigrationPanel='1';
    card.style.marginTop='16px';
    card.innerHTML=`
      <div class="top" style="align-items:center">
        <div><h3>☁ Cloud Migration</h3><div class="sub">Move the current RK Studio browser data into Supabase without deleting your local copy.</div></div>
        <span class="rk-migration-safe">Local backup preserved</span>
      </div>
      <div id="rkMigrationCounts" class="rk-migration-counts"></div>
      <div class="rk-migration-actions">
        <button id="rkMigrationRun" class="btn" type="button" onclick="rkRunCloudMigration()">☁ Migrate to Supabase</button>
        <button class="btn secondary" type="button" onclick="rkVerifyCloudMigration()">✓ Verify Cloud Data</button>
      </div>
      <div id="rkMigrationMessage" class="rk-migration-message" data-type="info">No migration has been run yet. Your browser data remains unchanged.</div>`;
    root.appendChild(card);
    renderCounts();
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,250));
  [800,1500,2500].forEach(ms=>setTimeout(mount,ms));
  setInterval(mount,1800);
})();
</script>

<script id="rk-v145-cloud-governance">
(function(){
  const cloud=()=>window.RK_SUPABASE;
  const isCloud=()=>!!cloud() && sessionStorage.getItem('rkStudioAuthProvider')==='supabase';
  function roleRows(){
    return Object.entries(db.roles||{}).map(([key,r])=>({
      key,name:r?.name||key,permissions:Array.isArray(r?.permissions)?r.permissions:[],
      is_builtin:['admin','manager','photographer','editor'].includes(key)
    }));
  }

  async function syncRoles(){
    if(!isCloud())return;
    const rows=roleRows();
    if(!rows.length)return;
    const {error}=await cloud().from('roles').upsert(rows,{onConflict:'key'});
    if(error)throw error;
  }

  async function hydrateRoles(){
    if(!isCloud())return;
    const {data,error}=await cloud().from('roles').select('key,name,permissions,is_builtin').order('key');
    if(error)throw error;
    if(data?.length){
      const merged={};
      data.forEach(r=>merged[r.key]={name:r.name,permissions:Array.isArray(r.permissions)?r.permissions:[]});
      // Preserve built-ins/custom roles that exist only locally until they are pushed.
      Object.entries(db.roles||{}).forEach(([k,v])=>{if(!merged[k])merged[k]=v});
      db.roles=merged;
    }
  }

  function settingsToRow(s){
    return {
      id:true,
      studio_name:s.studio||'RK Studio',
      phone:s.phone||null,address:s.address||null,
      company_logo_path:s.companyLogoPath||null,
      primary_color:s.primary||null,secondary_color:s.secondary||null,
      background_color:s.background||null,card_color:s.cardColor||null,
      theme:s.theme==='dark'?'dark':'light',
      sidebar_style:s.sidebar==='light'?'light':'dark',sidebar_color:s.sidebarColor||null,
      compact:s.compact==='yes'?'yes':'no',sidebar_width:Number(s.sidebarWidth||245),
      radius:Number(s.radius||15),font_size:Number(s.fontSize||16),
      font_family:s.fontFamily||null,shadow:s.shadow||null,card_border:s.cardBorder||null,
      button_style:s.buttonStyle||null,
      welcome_enabled:(s.welcome?.enabled!==false),
      welcome_title:s.welcome?.title||null,welcome_message:s.welcome?.message||null,
      welcome_duration_ms:Number(s.welcome?.duration||1400),
      whatsapp_templates:s.waTemplates||s.whatsappTemplates||{},
      extra_services:db.extraServices||[],custom_settings:s
    };
  }
  function rowToSettings(r){
    const extra=r.custom_settings||{};
    return {
      ...db.settings,...extra,
      studio:r.studio_name||extra.studio||'RK Studio',
      phone:r.phone||extra.phone||'',
      address:r.address||extra.address||'',
      companyLogoPath:r.company_logo_path||extra.companyLogoPath||'',
      primary:r.primary_color||extra.primary||'#6c4df6',
      secondary:r.secondary_color||extra.secondary||'#9a84ff',
      background:r.background_color||extra.background||'#f5f6fa',
      cardColor:r.card_color||extra.cardColor||'#fff',
      theme:r.theme||extra.theme||'light',
      sidebar:r.sidebar_style||extra.sidebar||'dark',
      sidebarColor:r.sidebar_color||extra.sidebarColor||'#17151f',
      compact:r.compact||extra.compact||'no',
      sidebarWidth:Number(r.sidebar_width||extra.sidebarWidth||245),
      radius:Number(r.radius||extra.radius||15),
      fontSize:Number(r.font_size||extra.fontSize||16),
      fontFamily:r.font_family||extra.fontFamily||'Inter,system-ui,-apple-system,Segoe UI,sans-serif',
      shadow:r.shadow||extra.shadow||'soft',
      cardBorder:r.card_border||extra.cardBorder||'on',
      buttonStyle:r.button_style||extra.buttonStyle||'rounded',
      waTemplates:r.whatsapp_templates||extra.waTemplates||{},
      welcome:{
        enabled:r.welcome_enabled!==false,
        title:r.welcome_title||extra.welcome?.title||'Welcome back 👋',
        message:r.welcome_message||extra.welcome?.message||"Let's manage your studio today.",
        duration:Number(r.welcome_duration_ms||extra.welcome?.duration||1400)
      }
    };
  }

  const originalSettingsSync=window.rkCloudSyncSettings;
  window.rkCloudSyncSettings=async function(){
    if(!isCloud())return {cloud:false};
    const s=db.settings||{};
    // Settings saves must not depend on the roles table. The roles table has
    // its own RLS policy and role-management code handles role synchronization.
    // Mixing the two made a normal UI theme save fail with a roles RLS error.
    const {error}=await cloud().from('studio_settings').upsert(settingsToRow(s),{onConflict:'id'});
    if(error)throw error;
    return {cloud:true};
  };

  window.rkCloudHydrateGovernance=async function(){
    if(!isCloud())return false;
    try{
      await hydrateRoles();
      const {data,error}=await cloud().from('studio_settings').select('*').eq('id',true).maybeSingle();
      if(error)throw error;
      if(data){
        db.settings=rowToSettings(data);
        if(!RK_SERVER_ONLY) localStorage.setItem(KEY,JSON.stringify(db));
        if(typeof applyUI==='function')applyUI();
      }
      await syncRoles();
      // Do not call render() here. Replacing the Settings DOM while the user
      // is editing causes focus loss, scroll jumps and resets unsaved fields.
      return true;
    }catch(e){
      console.warn('Cloud governance hydration failed:',e);
      return false;
    }
  };

  // Sync role changes and existing UUID-backed profiles after the UI saves them.
  const wrapUser=window.saveUser;
  if(typeof wrapUser==='function'){
    window.saveUser=async function(id){
      const result=await wrapUser(id);
      try{
        if(isCloud()){
          const u=(db.users||[]).find(x=>x.id===id)||currentUser;
          if(u && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(u.id))){
            await cloud().from('profiles').upsert({
              id:u.id,username:u.username||null,name:u.name||u.username||'User',
              role:u.role||'photographer',active:u.active!==false,
              email:u.email||null
            },{onConflict:'id'});
          }
          await syncRoles();
        }
      }catch(e){console.warn('Cloud user-role sync failed:',e)}
      return result;
    };
  }

  const wrapRole=window.saveRole;
  if(typeof wrapRole==='function'){
    window.saveRole=function(role){
      const result=wrapRole(role);
      Promise.resolve(result).then(()=>syncRoles()).catch(e=>console.warn('Cloud role sync failed:',e));
      return result;
    };
  }

  // Cloud-first governance hydration whenever a Supabase session exists.
  setTimeout(async()=>{
    if(isCloud()){
      await window.rkCloudHydrateGovernance?.();
      document.querySelectorAll('[data-rk-cloud-status]').forEach(el=>{
        el.textContent='☁ Cloud Primary';
        el.dataset.state='synced';
        el.title='Supabase is the primary data source for this session.';
      });
    }
  },1400);

  // Also update the Settings label to make the source-of-truth explicit.
  function markPrimary(){
    document.querySelectorAll('[data-rk-cloud-status]').forEach(el=>{
      if(isCloud()){
        el.textContent='☁ Cloud Primary';
        el.dataset.state='synced';
        el.title='Supabase is the primary data source for this session.';
      }
    });
  }


  window.rkCloudSyncRoles=syncRoles;
})();
</script>

</style>

<script id="rk-v153-activity-dedupe">
(function(){
  window.rkDedupeLocalActivityLogs=function(){
    const logs=Array.isArray(db.activityLog)?db.activityLog:[];
    const out=[],seen=new Set();
    for(const x of logs){
      const key=[
        x.id||'',x.at||x.createdAt||'',x.type||'System',
        x.action||'',x.detail||'',x.entityId||''
      ].join('|');
      if(seen.has(key))continue;

    db.activityLog=out;
    if(!RK_SERVER_ONLY) localStorage.setItem(KEY,JSON.stringify(db));
    if(typeof render==='function')render();
    return {before:logs.length,after:out.length,removed:logs.length-out.length};
  };
})();

<script id="rk-v160-server-only-multi-user">
(function(){
  if(typeof RK_SERVER_ONLY==='undefined' || !RK_SERVER_ONLY) return;

  const tableMap={
    saveCustomer:['customers'], saveEvent:['shoots'], savePackage:['packages'],
    saveInvoice:['invoices','payments'], savePayment:['payments'], saveExpense:['expenses']
  };

  function snapshotTable(table){
    const arr=Array.isArray(db?.[table])?db[table]:[];
    return new Map(arr.map(x=>[String(x.id),JSON.stringify(x)]));
  }
  function diffIds(table,before){
    const arr=Array.isArray(db?.[table])?db[table]:[];
    const changed=[];
    const after=new Map(arr.map(x=>[String(x.id),JSON.stringify(x)]));
    for(const [id,val] of after){ if(before.get(id)!==val) changed.push(id); }
    for(const id of before.keys()){ if(!after.has(id)) changed.push(id); }
    return [...new Set(changed)];
  }

  function wrapSave(name,tables){
    const fn=window[name];
    if(typeof fn!=='function' || fn.__rkServerOnlyWrapped) return;
    const w=function(...args){
      const before={}; tables.forEach(t=>before[t]=snapshotTable(t));
      const result=fn.apply(this,args);
      Promise.resolve(result).then(()=>{
        tables.forEach(t=>{
          const ids=diffIds(t,before[t]);
          if(ids.length) window.rkCloudMarkDirty?.(t,ids);
        });
      }).catch(()=>{});
      return result;
    };
    w.__rkServerOnlyWrapped=true;
    window[name]=w;
  }

  Object.entries(tableMap).forEach(([name,tables])=>wrapSave(name,tables));

  // Activity log is its own server table and is appended by rkLog().
  wrapSave('rkLog',['activityLog']);

  // Settings have a dedicated upsert path. Keep UI-only resets/logo removal in sync too.
  ['resetUISettings','removeCompanyLogo'].forEach(name=>{
    const fn=window[name];
    if(typeof fn!=='function' || fn.__rkServerOnlyWrapped) return;
    const w=function(...args){
      const r=fn.apply(this,args);
      Promise.resolve(window.rkCloudSyncSettings?.()).catch(e=>console.warn('Cloud settings sync failed:',e));
      return r;
    };
    w.__rkServerOnlyWrapped=true;
    window[name]=w;
  });

  // Never create browser database backups in server-only mode.
  const oldCreateAuto=window.createAutoBackupSnapshot;
  if(typeof oldCreateAuto==='function'){
    window.createAutoBackupSnapshot=function(){
      const el=document.getElementById('rkAutoBackupStatus');
      if(el)el.textContent='Server-only mode — browser data backup disabled.';
    };
  }
  const oldRestoreAuto=window.restoreLatestAutoBackup;
  if(typeof oldRestoreAuto==='function'){
    window.restoreLatestAutoBackup=function(){
      alert('Server-only mode is enabled. App data is stored in Supabase Cloud.');
    };
  }

  // Make the settings/status copy explicit.
  const badgeText=()=>document.querySelectorAll('[data-rk-cloud-status]').forEach(el=>{
    if(sessionStorage.getItem('rkStudioAuthProvider')==='supabase'){
      el.title='Supabase is the source of truth for RK Studio data.';
    }
  });
  setTimeout(badgeText,1500);
})();
</script>

<script id="rk-v167-server-authoritative-multiplayer">
(function(){
  /*
   * Server-authoritative data mode.
   * - Supabase is the only persistent source for app data.
   * - localStorage is not used for the application database.
   * - Each browser keeps a last-server snapshot and uploads only records it
   *   changed locally, preventing a stale second browser from overwriting
   *   unrelated records.
   * - Realtime updates are merged into the live UI for simultaneous users.
   */
  if(!window.RK_SERVER_ONLY) return;
  const cloud=()=>window.RK_SUPABASE;
  const isCloud=()=>!!cloud() && sessionStorage.getItem('rkStudioAuthProvider')==='supabase';
  const TABLES=[
    ['customers','customers'],['shoots','events'],['packages','packages'],
    ['invoices','invoices'],['payments','payments'],['expenses','expenses'],
    ['activity_logs','activityLog']
  ];
  let baseline={};
  let syncTimer=null, syncing=false;
  let initialized=false;

  function clone(v){
    try{return JSON.parse(JSON.stringify(v));}catch(e){return v;}
  }
  function localRows(name,local){return Array.isArray(db?.[local])?db[local]:[];}
  function rowFor(name,obj){
    if(name==='customers')return customerToRow(obj);
    if(name==='shoots')return shootToRow(obj);
    if(name==='packages')return packageToRow(obj);
    if(name==='invoices')return invoiceToRow(obj);
    if(name==='payments')return toPayment(obj,null);
    if(name==='expenses')return toExpense(obj,null);
    if(name==='activity_logs')return toLog(obj,null);
    return obj;
  }
  function comparable(name,obj){
    try{return JSON.stringify(rowFor(name,obj));}catch(e){return JSON.stringify(obj);}
  }
  function takeBaseline(){
    baseline={};
    TABLES.forEach(([name,local])=>{
      baseline[name]=new Map(localRows(name,local).map(x=>[String(x.id),comparable(name,x)]));
    });
    baseline.studio_settings=JSON.stringify(db.settings||{});
    initialized=true;
  }
  function changedRows(name,local){
    const old=baseline[name]||new Map();
    return localRows(name,local).filter(x=>old.get(String(x.id))!==comparable(name,x));
  }

  async function serverSettings(){
    if(!isCloud())return;
    const s=db.settings||{};
    const row=(typeof settingsToRow==='function')?settingsToRow(s):{
      id:true,studio_name:s.studio||'RK Studio',phone:s.phone||null,address:s.address||null,
      primary_color:s.primary||null,secondary_color:s.secondary||null,
      background_color:s.background||null,card_color:s.cardColor||null,
      theme:s.theme==='dark'?'dark':'light',sidebar_style:s.sidebar==='light'?'light':'dark',
      sidebar_color:s.sidebarColor||null,compact:s.compact==='yes'?'yes':'no',
      sidebar_width:Number(s.sidebarWidth||245),radius:Number(s.radius||15),font_size:Number(s.fontSize||16),
      font_family:s.fontFamily||null,shadow:s.shadow||null,card_border:s.cardBorder||null,
      button_style:s.buttonStyle||null,custom_settings:s
    };
    const {error}=await cloud().from('studio_settings').upsert(row,{onConflict:'id'});
    if(error)throw error;
  }

  async function pushChanged(){
    if(!isCloud()||!initialized)return;
    const failures=[];
    for(const [name,local] of TABLES){
      const rows=changedRows(name,local);
      if(!rows.length)continue;
      const uid=await authUserId();
      const payload=rows.map(x=>{
        const r=rowFor(name,x);
        if((name==='payments'||name==='expenses'||name==='activity_logs')&&uid){
          if(name==='activity_logs')r.user_id=uid; else r.created_by=uid;
        }
        return r;
      });
      const {error}=await cloud().from(name).upsert(payload,{onConflict:'id'});
      if(error)failures.push(`${name}: ${error.message||JSON.stringify(error)}`);
    }
    if(JSON.stringify(db.settings||{})!==baseline.studio_settings) await serverSettings();
    if(failures.length)throw new Error(failures.join(' | '));
    takeBaseline();
  }

  async function authoritativeHydrate(){
    if(!isCloud())return false;
    try{
      const results={};
      for(const [name,local] of TABLES){
        const {data,error}=await cloud().from(name).select('*');
        if(error)throw new Error(`${name}: ${error.message||JSON.stringify(error)}`);
        results[name]=data||[];
      }
      const {data:settings,error:se}=await cloud().from('studio_settings').select('*').eq('id',true).maybeSingle();
      if(se)throw new Error(`studio_settings: ${se.message||JSON.stringify(se)}`);

      /* Cloud is authoritative on startup. Do not resurrect browser-only rows. */
      db.customers=results.customers.map(rowToCustomer);
      db.events=results.shoots.map(rowToShoot);
      db.packages=results.packages.map(rowToPackage);
      const invLocal=new Map((db.invoices||[]).map(x=>[String(x.id),x]));
      db.invoices=results.invoices.map(r=>rowToInvoice(r,invLocal.get(String(r.id))));
      db.payments=results.payments.map(rowToPayment);
      db.expenses=results.expenses.map(rowToExpense);
      db.activityLog=results.activity_logs.map(rowToLog);
      if(settings && typeof rowToSettings==='function')db.settings=rowToSettings(settings);
      takeBaseline();
      if(typeof applyUI==='function')applyUI();
      if(typeof render==='function')render();
      initialized=true;
      if(typeof status==='function')status('synced','Server is the source of truth.');
      window.RK_CLOUD_LAST_ERROR='';
      return true;
    }catch(e){
      console.error('Server-authoritative hydrate failed:',e);
      if(typeof status==='function')status('local','Cloud load failed: '+(e.message||e));
      window.RK_CLOUD_LAST_ERROR=e.message||String(e);
      return false;
    }
  }

  function schedule(){
    if(!isCloud())return;
    clearTimeout(syncTimer);
    syncTimer=setTimeout(async()=>{
      if(syncing)return;
      syncing=true;
      try{
        if(typeof status==='function')status('syncing','Saving to server…');
        await pushChanged();
        if(typeof status==='function')status('synced','Saved to server.');
        window.RK_CLOUD_LAST_ERROR='';
      }catch(e){
        console.error('Server save failed:',e);
        window.RK_CLOUD_LAST_ERROR=e.message||String(e);
        if(typeof status==='function')status('local','Server save failed: '+(e.message||e));
      }finally{syncing=false;}
    },350);
  }

  /* Expose the server-authoritative scheduler used by every existing save(). */
  window.rkCloudScheduleSave=schedule;
  window.rkCloudSyncPhase3=pushChanged;
  window.rkCloudHydratePhase3=authoritativeHydrate;

  /* Collaborative realtime: merge remote changes without replacing the whole DB. */
  const remoteUpsert=(arr,obj)=>{
    const i=arr.findIndex(x=>String(x.id)===String(obj.id));
    if(i>=0)arr[i]=obj;else arr.push(obj);
  };
  function subscribe(name){
    if(!isCloud())return;
    const ch=cloud().channel('rk-v167-'+name).on('postgres_changes',{event:'*',schema:'public',table:name},payload=>{
      try{
        if(name==='studio_settings'){
          if(payload.eventType==='DELETE')return;
          if(typeof rowToSettings==='function'){
            db.settings=rowToSettings(payload.new);
            baseline.studio_settings=JSON.stringify(db.settings||{});
            if(typeof applyUI==='function')applyUI();
            if(document.getElementById('settings')&&!document.getElementById('settings').classList.contains('hidden')&&typeof renderSettings==='function')renderSettings();
          }
          return;
        }
        if(name==='customers'){
          if(payload.eventType==='DELETE')db.customers=db.customers.filter(x=>String(x.id)!==String(payload.old.id));
          else remoteUpsert(db.customers,rowToCustomer(payload.new));
        }
        if(name==='shoots'){
          if(payload.eventType==='DELETE')db.events=db.events.filter(x=>String(x.id)!==String(payload.old.id));
          else remoteUpsert(db.events,rowToShoot(payload.new));
        }
        if(name==='packages'){
          if(payload.eventType==='DELETE')db.packages=db.packages.filter(x=>String(x.id)!==String(payload.old.id));
          else remoteUpsert(db.packages,rowToPackage(payload.new));
        }
        if(name==='invoices'){
          if(payload.eventType==='DELETE')db.invoices=db.invoices.filter(x=>String(x.id)!==String(payload.old.id));
          else remoteUpsert(db.invoices,rowToInvoice(payload.new,(db.invoices||[]).find(x=>String(x.id)===String(payload.new.id))));
        }
        if(name==='payments'){
          if(payload.eventType==='DELETE')db.payments=db.payments.filter(x=>String(x.id)!==String(payload.old.id));
          else remoteUpsert(db.payments,rowToPayment(payload.new));
        }
        if(name==='expenses'){
          if(payload.eventType==='DELETE')db.expenses=db.expenses.filter(x=>String(x.id)!==String(payload.old.id));
          else remoteUpsert(db.expenses,rowToExpense(payload.new));
        }
        if(name==='activity_logs'){
          if(payload.eventType==='DELETE')db.activityLog=db.activityLog.filter(x=>String(x.id)!==String(payload.old.id));
          else remoteUpsert(db.activityLog,rowToLog(payload.new));
        }
        /* Update the server baseline so a remote edit is not re-uploaded by this browser. */
        if(baseline[name]){
          const id=String(payload.eventType==='DELETE'?payload.old.id:payload.new.id);
          if(payload.eventType==='DELETE')baseline[name].delete(id);
          else {
            const local=localRows(name,TABLES.find(x=>x[0]===name)?.[1]||name).find(x=>String(x.id)===id);
            if(local)baseline[name].set(id,comparable(name,local));
          }
        }
        if(typeof render==='function')render();
      }catch(e){console.warn('Realtime update skipped',e)}
    }).subscribe();
    return ch;
  }
  let channels=[];
  function start(){
    channels.forEach(ch=>{try{cloud().removeChannel(ch)}catch(e){}});
    channels=TABLES.map(x=>subscribe(x[0])).filter(Boolean);
    channels.push(subscribe('studio_settings'));
  }
  window.rkCloudStartRealtimePhase3=start;

  /* Do not show local data before the first authoritative server load. */
  if(isCloud()){
    setTimeout(async()=>{
      const ok=await authoritativeHydrate();
      if(ok)start();
    },0);
  }
})();
</script>

<style id="rk-v120-final-theme-visibility">
/* v120: FINAL theme layer. Placed after every previous stylesheet so legacy
   hard-coded black/white button rules cannot override the active theme. */
:root{
  --theme-action-bg:var(--card,#191b22);
  --theme-action-text:var(--text,#f4f4f7);
  --theme-action-border:var(--border,#30333d);
}
body.theme-light{
  --theme-action-bg:var(--card,#fff);
  --theme-action-text:var(--text,#20212a);
  --theme-action-border:var(--border,#e8e8ef);
}
body.theme-dark{
  --theme-action-bg:var(--card,#191b22);
  --theme-action-text:var(--text,#f4f4f7);
  --theme-action-border:var(--border,#30333d);
}

/* All normal action controls */
button:not([disabled]),
.btn,
.small,
.actions button,
.management-actions button,
.package-actions button,
.pm-actions button,
.pm-expense-actions button,
.invoice-mobile-actions button,
.reminder-mobile-actions button,
.mobile-actions button{
  background:var(--theme-action-bg)!important;
  color:var(--theme-action-text)!important;
  border-color:var(--theme-action-border)!important;
  -webkit-text-fill-color:var(--theme-action-text)!important;
}

/* Semantic primary actions */
button.btn:not(.secondary):not(.danger),
.btn.primary,
button.primary,
.save-btn,
#management .top .btn,
#management .top .actions .btn,
#shoots .top .btn,
#invoices .top .btn{
  background:var(--primary)!important;
  color:var(--button-text,#fff)!important;
  -webkit-text-fill-color:var(--button-text,#fff)!important;
  border-color:var(--primary)!important;
}

/* Secondary controls must remain visible on both themes */
button.secondary,.btn.secondary{
  background:var(--theme-action-bg)!important;
  color:var(--theme-action-text)!important;
  -webkit-text-fill-color:var(--theme-action-text)!important;
  border:1px solid var(--theme-action-border)!important;
}

/* Danger remains red but gets a theme-safe surface */
button.danger,.btn.danger{
  background:var(--theme-action-bg)!important;
  color:#e85d73!important;
  -webkit-text-fill-color:#e85d73!important;
  border-color:color-mix(in srgb,#e85d73 50%,var(--theme-action-border))!important;
}

/* Mobile Photographer Management action buttons */
@media(max-width:768px){
  #management .pm-actions button,
  #management .management-actions button,
  #management .pm-expense-actions button{
    background:var(--theme-action-bg)!important;
    color:var(--theme-action-text)!important;
    -webkit-text-fill-color:var(--theme-action-text)!important;
    border:1px solid var(--theme-action-border)!important;
    box-shadow:none!important;
  }
  #management .pm-actions button:hover,
  #management .management-actions button:hover,
  #management .pm-expense-actions button:hover{
    background:color-mix(in srgb,var(--primary) 14%,var(--theme-action-bg))!important;
    color:var(--primary)!important;
    -webkit-text-fill-color:var(--primary)!important;
    border-color:var(--primary)!important;
  }
  #management .pm-actions button.danger,
  #management .management-actions button.danger,
  #management .pm-expense-actions button.danger{
    color:#e85d73!important;
    -webkit-text-fill-color:#e85d73!important;
  }
}

/* Mobile bottom navigation follows the selected theme */
@media(max-width:768px){
  .bottom-nav,.mobile-bottom-nav,.mobile-nav,nav.bottom-nav{
    background:var(--bg)!important;
    border-top:1px solid var(--border)!important;
    color:var(--text)!important;
    box-shadow:0 -8px 24px rgba(0,0,0,.12)!important;
  }
  .bottom-nav button,.mobile-bottom-nav button,.mobile-nav button,nav.bottom-nav button{
    background:transparent!important;
    color:var(--text)!important;
    -webkit-text-fill-color:var(--text)!important;
    border:1px solid transparent!important;
  }
  .bottom-nav button.active,.mobile-bottom-nav button.active,
  .mobile-nav button.active,nav.bottom-nav button.active,

/* Mobile top controls */
@media(max-width:768px){

/* Prevent native/browser default dark text in themed form controls */
input,select,textarea{
  background:var(--input-bg)!important;
