<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17151f">
<meta name="color-scheme" content="light dark">
<title>RK Studio — Wedding Shoot Manager</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#20212a;--muted:#737784;--primary:#6c4df6;--secondary:#9a84ff;--border:#e8e8ef;--green:#1fa774;--red:#e05252;--radius:15px;--shadow:0 8px 24px rgba(24,22,36,.06);--font-size:16px;--sidebar-width:245px}
*{box-sizing:border-box}body{margin:0;font-family:var(--font-family,Inter,system-ui,-apple-system,Segoe UI,sans-serif);font-size:var(--font-size);background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
aside{width:var(--sidebar-width);background:var(--side,#17151f);color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0}
.brand{font-size:22px;font-weight:800;padding:8px 10px 26px}.brand span{color:#a994ff}
nav button{display:block;width:100%;text-align:left;padding:12px 14px;margin:4px 0;border-radius:10px;background:transparent;color:#bcbac6}
nav button.active,nav button:hover{background:#292433;color:#fff}.main{margin-left:var(--sidebar-width);width:calc(100% - var(--sidebar-width));padding:28px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:5px}
.btn{padding:11px 16px;border-radius:var(--button-radius,10px);background:var(--primary);color:#fff;font-weight:700;box-shadow:var(--button-shadow,none)}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.btn.green{background:var(--green)}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:var(--card-border,1px solid var(--border));border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.stat{font-size:28px;font-weight:800;margin:8px 0}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#eeeaff;color:#5c42d8}.pill.green{background:#e4f8f0;color:#15835a}.pill.orange{background:#fff1db;color:#a56300}
table{width:100%;border-collapse:collapse}.tablewrap{overflow:auto}.th,th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}th,td{padding:13px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.actions{display:flex;gap:7px;flex-wrap:wrap}.compact-ui th,.compact-ui td{padding:7px 8px}.compact-ui .card{padding:13px}.menu{position:relative;display:inline-block}.dots{width:34px;height:34px;padding:0;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:20px;line-height:1;cursor:pointer}.menu-pop{display:none;position:absolute;right:0;top:40px;z-index:50;min-width:190px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:6px}.menu.open .menu-pop{display:block}.menu-pop button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:9px 10px;border-radius:8px;cursor:pointer}.menu-pop button:hover{background:#f5f3ff}.menu-pop .danger{color:var(--red)}.small{padding:7px 10px;border-radius:8px;background:#f1efff;color:#5940d4;font-weight:700}.danger{color:var(--red)}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:calc(var(--radius) * .65);background:var(--input-bg,#fff);color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.label{font-size:13px;font-weight:700;margin-bottom:6px;display:block}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{background:var(--card);color:var(--text);border-radius:calc(var(--radius) + 3px);width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}
.invoice{max-width:850px;margin:auto;background:var(--card);border:1px solid var(--border);padding:34px;border-radius:16px}.invoicehead{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #222;padding-bottom:20px}.invoice h2{margin:0}.invoice .total{font-size:25px;font-weight:800}.right{text-align:right}.invoice table{margin-top:22px}.invoice-actions{display:flex;gap:10px;justify-content:flex-end;margin-bottom:16px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:var(--card);border:1px solid var(--border);min-height:100px;border-radius:10px;padding:9px}.event{font-size:11px;background:#eeeaff;color:#5239cc;padding:5px;border-radius:6px;margin-top:6px}
.package-card{position:relative}.package-price{font-size:27px;font-weight:800;margin:12px 0}.package-list{padding-left:18px;color:var(--muted);line-height:1.8}.package-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tag{display:inline-block;padding:4px 8px;border-radius:6px;background:#f2efff;color:#5b42d4;font-size:11px;font-weight:700;margin:3px 3px 0 0}.empty{padding:45px;text-align:center;color:var(--muted)}.hidden{display:none!important}

.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:#ece9ff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);flex:0 0 auto}.avatar.lg{width:92px;height:92px;font-size:28px}.customer-cell{display:flex;align-items:center;gap:10px}.photo-preview{width:112px;height:112px;border-radius:18px;object-fit:cover;border:1px solid var(--border);background:#f1efff}.settings-section{border-top:1px solid var(--border);padding-top:18px;margin-top:18px}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.status-paid{color:var(--green);font-weight:800}.status-unpaid{color:#b36a00;font-weight:800}.btn.outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}

.mobile-topbar{display:none}
.nav-icon{display:inline-flex;width:24px;justify-content:center;margin-right:8px;font-size:17px;line-height:1;vertical-align:middle}
nav button{display:flex;align-items:center;gap:2px}
@media(max-width:700px){
  .mobile-topbar{display:flex;position:fixed;top:0;left:0;right:0;height:58px;z-index:1100;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(135deg,#17151f,#2d2148);color:#fff;box-shadow:0 4px 16px rgba(20,12,40,.16)}
  .mobile-brand-mark{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;background:linear-gradient(135deg,var(--primary),#e04ffb);box-shadow:0 5px 14px rgba(108,77,246,.28)}
  .mobile-studio-name{font-size:17px;font-weight:800;letter-spacing:.1px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-logout{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:18px}
  .main{padding-top:72px}
  nav button{display:block}
  nav button .nav-icon{display:block;width:auto;margin:0 0 3px;font-size:17px}
}
@media(max-width:1000px){
  aside{width:82px;padding:15px 9px}
  .brand{font-size:0;text-align:center;padding:8px 0 22px}
  .brand:after{content:"RK";font-size:20px}
  nav button{font-size:0;text-align:center;padding:12px 6px}
  nav button:before{content:"◆";font-size:13px;opacity:.9}
  .main{margin-left:82px;width:calc(100% - 82px);padding:22px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .formgrid{grid-template-columns:1fr}
  .full{grid-column:auto}
}
@media(max-width:700px){
  body{padding-bottom:74px;overflow-x:hidden}
  /* Mobile: hide the desktop/tablet decorative diamond marker; use only the real nav icons. */
  nav button:before{content:none!important;display:none!important}
  aside{left:0;right:0;bottom:0;top:auto;width:100%;height:68px;padding:5px 8px;background:var(--side,#17151f);z-index:1000;border-top:1px solid rgba(255,255,255,.08)}
  .brand{display:none}
  nav{display:flex;gap:4px;overflow-x:auto;height:100%;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;width:auto;min-width:72px;height:58px;margin:0;padding:7px 8px;border-radius:10px;font-size:11px;text-align:center;white-space:nowrap;color:#bcbac6}
  nav button:before{display:block;font-size:14px;margin-bottom:3px}
  nav button.active{background:#292433;color:#fff}
  .main{margin:0;width:100%;max-width:none;padding:16px 12px 18px}
  .top{align-items:stretch;gap:12px;flex-direction:column;margin-bottom:18px}
  .top h1{font-size:24px}
  .top .btn{width:100%}
  .stats,.cards{grid-template-columns:1fr}
  .card{padding:14px;border-radius:12px}
  .stat{font-size:24px}
  .toolbar{flex-direction:column}
  .toolbar input{min-width:0}
  .actions{gap:6px}
  .actions .small{flex:1;min-width:76px}
  .tablewrap{margin-left:-2px;margin-right:-2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{padding:10px 8px;font-size:13px}
  .calendar{grid-template-columns:repeat(7,minmax(86px,1fr));overflow-x:auto;padding-bottom:6px}
  .day{min-height:90px}
  .invoice{padding:16px;border-radius:12px;overflow:hidden}
  .invoicehead{flex-direction:column;gap:14px}
  .right{text-align:left}
  .invoice-actions{flex-direction:column}
  .invoice-actions .btn{width:100%}
  .modal{padding:10px}
  .modalbox{width:100%;max-height:92vh;padding:16px}
  .logo-setting{align-items:stretch}
  .company-logo-preview{width:100%;height:120px}
  .extra-grid{grid-template-columns:1fr 1fr}
  .extra-grid button{grid-column:1/-1}
}
@media(max-width:420px){
  .formgrid{gap:10px}
  .actions .small{min-width:0;padding:7px 8px;font-size:12px}
  .extra-grid{grid-template-columns:1fr}
  .extra-grid button{grid-column:auto}
  .payment-media-backdrop{padding:10px}
  .payment-media-dialog{max-width:96vw;max-height:94vh;padding:8px}
  .payment-media-dialog img{max-width:92vw;max-height:86vh}
}

.customer-modal-footer{position:sticky;bottom:0;background:var(--card);padding:12px 0 calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:3}.customer-modal-footer .btn{min-height:46px;min-width:150px}@media(max-width:700px){.customer-modal-footer .btn{width:100%}}

/* Mobile customer list: keep actions immediately visible */
@media(max-width:700px){
  .customer-table{min-width:0!important;width:100%;table-layout:fixed}
  .customer-table th:nth-child(2),.customer-table td:nth-child(2),
  .customer-table th:nth-child(3),.customer-table td:nth-child(3),
  .customer-table th:nth-child(4),.customer-table td:nth-child(4),
  .customer-table th:nth-child(5),.customer-table td:nth-child(5){display:none}
  .customer-table th:first-child,.customer-table td:first-child{width:42%}
  .customer-table th:last-child,.customer-table td:last-child{width:58%}
  .customer-table td:last-child{vertical-align:middle}
  .customer-table .actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:100%}
  .customer-table .actions .small{min-width:0!important;width:100%!important;padding:7px 4px!important;font-size:11px!important;white-space:nowrap}
  .customer-table .customer-cell{min-width:0}
  .customer-table .customer-cell b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(max-width:420px){
  .customer-table th:first-child,.customer-table td:first-child{width:40%}
  .customer-table th:last-child,.customer-table td:last-child{width:60%}
  .customer-table .actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .customer-table .actions .small{font-size:11px!important;padding:7px 3px!important}
}
@media print{aside,.top,.invoice-actions{display:none!important}.main{margin:0;width:100%;padding:0}.invoice{border:0}}

/* Actions are shown only in the Customers tab */
#dashboard .action-row,
#planner .action-row,
#invoices .action-row,
#management .action-row,
#settings .action-row,
#packages .action-row,
.non-customer-actions { display:none !important; }


.logo-setting{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.company-logo-preview{width:210px;height:110px;border:1px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--input-bg)}
.company-logo-preview img{max-width:200px;max-height:100px;object-fit:contain}
.rk-invoice-logo{display:block;max-width:180px;max-height:70px;object-fit:contain;margin-bottom:8px}
.extra-service-box{margin:18px 0;padding:14px;border:1px dashed var(--primary);border-radius:12px;background:var(--card)}
.extra-grid{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:8px;align-items:center}
.custom-extra{margin-top:9px}
.extra-grid input,.extra-grid select{min-height:38px}
@media(max-width:700px){.extra-grid{grid-template-columns:1fr 1fr}.extra-grid button{grid-column:1/-1}}

.payment-media-viewer{position:fixed;inset:0;z-index:99999}
.payment-media-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:24px}
.payment-media-dialog{position:relative;max-width:min(92vw,1000px);max-height:92vh;background:#fff;border-radius:14px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.payment-media-dialog img{display:block;max-width:88vw;max-height:82vh;width:auto;height:auto;object-fit:contain;border-radius:8px}
.payment-media-close{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:#111;color:#fff;font-size:18px;cursor:pointer;z-index:2}
.payment-media-error{display:none;padding:40px;text-align:center;color:#555}


/* Login protection */
#loginScreen{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#2b2542 0,#17151f 45%,#0d0c12 100%)}
.login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}
.login-logo{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:#17151f;color:#fff;border:3px solid #a994ff;font-size:24px;font-weight:900}
.login-card h1{margin:0;font-size:28px;color:#20212a}.login-card p{color:#737784;margin:7px 0 22px}.login-card .login-error{min-height:20px;color:#d33b3b;font-size:13px;font-weight:700;margin:9px 0}.login-card .login-btn{width:100%;margin-top:8px;padding:13px 16px;border-radius:12px;background:#6c4df6;color:#fff;font-weight:800}.login-card input{font-size:18px;text-align:center;letter-spacing:.18em}.logout-btn{margin-top:18px;width:100%;background:transparent;color:#ffb1b1;border:1px solid rgba(255,255,255,.16);padding:10px 12px;border-radius:10px;font-weight:700}
.security-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}.security-box .full{grid-column:1/-1}
@media(max-width:700px){.login-card{padding:24px;border-radius:18px}.security-box{grid-template-columns:1fr}.security-box .full{grid-column:auto}}

/* User & role management */
.user-menu{margin-top:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04)}
.user-menu .uname{font-weight:800}.user-menu .urole{font-size:12px;color:#b9b4c8;margin-top:2px}.role-badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#eee9ff;color:#5b3ed0;font-size:12px;font-weight:800}.users-table{width:100%;border-collapse:collapse}.users-table th,.users-table td{padding:10px;border-bottom:1px solid var(--border);text-align:left}.permission-note{font-size:12px;color:var(--muted)}
@media(max-width:700px){.users-table{min-width:720px}}

  body{min-width:0;overflow-x:hidden}

  .main{padding:20px!important}

@media(max-width:700px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  .main{width:100%;margin:0;padding:74px 10px 92px}
  .content{width:100%;max-width:100%;overflow:visible}
  .topbar,.mobile-topbar{left:0;right:0;width:100%}

  .invoice-actions .btn{width:100%;min-width:0;padding:10px 8px;font-size:12px;line-height:1.25}
  .invoice{width:100%;max-width:100%;padding:16px 12px;border-radius:12px;overflow:hidden}

<script>
const KEY='shaadiStudio_v1';

const RK_SERVER_ONLY=true;
let db=null;
if(!RK_SERVER_ONLY){
  try{ db=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ db=null; }
}
db=db||{
settings:{studio:"RK Studio",phone:"",address:""},
customers:[],events:[],invoices:[],packages:[{id:"p1",name:"Classic Wedding",price:55000,items:["Traditional Photography","Full Wedding Video","1 Premium Album","All Edited Photos"]},{id:"p2",name:"Premium Wedding",price:85000,items:["Candid + Traditional Photography","Cinematic Wedding Film","2 Premium Albums","Drone Coverage","All Edited Photos"]},{id:"p3",name:"Royal Wedding",price:125000,items:["2 Photographers","2 Videographers","Cinematic Film","Drone + 4K Coverage","2 Premium Albums","Pre-Wedding Shoot","All Edited Photos"]}]
};
const save=()=>{try{
  if(!RK_SERVER_ONLY) localStorage.setItem(KEY,JSON.stringify(db));
  if(window.rkCloudScheduleSave) window.rkCloudScheduleSave();
  return true;
}catch(e){console.error('RK Studio save failed',e);return false;}}
const DEFAULT_ROLES={
  admin:{name:'Administrator',permissions:['dashboard','customers','events','packages','invoices','management','activity','settings','userManagement','customerCreate','customerEdit','customerDelete','shootCreate','shootEdit','shootDelete','packageManage','invoiceCreate','invoiceEdit','invoiceDelete','paymentAdd','paymentDelete','expenseManage']},
  manager:{name:'Manager',permissions:['dashboard','customers','events','packages','invoices','management','settings','customerCreate','customerEdit','shootCreate','shootEdit','shootDelete','packageManage','invoiceCreate','invoiceEdit','paymentAdd','expenseManage']},
  photographer:{name:'Photographer',permissions:['dashboard','customers','events','customerCreate','customerEdit','shootCreate','shootEdit']},
  editor:{name:'Editor',permissions:['dashboard','customers','events','invoices','invoiceEdit','paymentAdd']},
};
const ROLE_LABELS={admin:'Administrator',manager:'Manager',photographer:'Photographer',editor:'Editor'};
const PERMISSION_GROUPS={
  'Pages':['dashboard','customers','events','packages','invoices','management','activity','settings','userManagement'],
  'Customer':['customerCreate','customerEdit','customerDelete'],
  'Shoot Planner':['shootCreate','shootEdit','shootDelete'],
  'Packages':['packageManage'],
  'Invoices & Payments':['invoiceCreate','invoiceEdit','invoiceDelete','paymentAdd','paymentDelete'],
  'Expenses / P&L':['expenseManage']
};
const PERMISSION_LABELS={dashboard:'Dashboard',customers:'Customers',events:'Shoot Planner',packages:'Packages',invoices:'Invoices',management:'Photographer Management / P&L',settings:'Settings',activity:'Activity Log',userManagement:'User & Role Management',customerCreate:'Create Customer',customerEdit:'Edit Customer',customerDelete:'Delete Customer',shootCreate:'Create Shoot',shootEdit:'Edit Shoot',shootDelete:'Delete Shoot',packageManage:'Manage Packages',invoiceCreate:'Create Invoice',invoiceEdit:'Edit Invoice',invoiceDelete:'Delete Invoice',paymentAdd:'Add Payment',paymentDelete:'Delete Payment',expenseManage:'Manage Expenses / P&L'};
if(!db.roles){db.roles=JSON.parse(JSON.stringify(DEFAULT_ROLES));save();}
function roleDef(role){return db.roles?.[role]||DEFAULT_ROLES[role]||{name:role,permissions:[]};}
function effectivePermissions(role){return roleDef(role).permissions||[];}

function makeId(prefix='u'){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

if(!db.packages) db.packages=[];
if(!db.settings) db.settings={}; if(!db.settings.studio || db.settings.studio==='Your Studio Name' || db.settings.studio==='ShaadiStudio') db.settings.studio='RK Studio';
if(!Array.isArray(db.users)){
  db.users=[{id:'u_admin',username:'admin',name:'Admin',role:'admin',passwordHash:db.settings.passwordHash||'03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4',active:true}];
  save();
}else if(!db.users.length){db.users=[{id:'u_admin',username:'admin',name:'Admin',role:'admin',passwordHash:db.settings.passwordHash||'03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4',active:true}];save();}
let currentUser=null;
function hasPermission(page){return !!currentUser && currentUser.role==='admin' ? true : !!currentUser && effectivePermissions(currentUser.role).includes(page);}
function can(action){return hasPermission(action);}
function actionGuard(action){if(!can(action)){alert('You do not have permission to perform this action.');return false;}return true;}
function guard(page){if(!hasPermission(page)){alert('You do not have permission to access this section.');return false;}return true;}
function updateUserUI(){
 const n=document.getElementById('sidebarUserName'),r=document.getElementById('sidebarUserRole');
 if(n)n.textContent=currentUser?.name||currentUser?.username||'User'; if(r)r.textContent=roleDef(currentUser?.role).name||'User';
 document.querySelectorAll('nav button').forEach(b=>{const m=b.getAttribute('onclick')?.match(/showPage\('(.*?)'/); if(m)b.style.display=hasPermission(m[1])?'block':'none';});
}

if(!db.payments) db.payments=[];
if(!db.expenses) db.expenses=[];
const DEFAULT_EXTRA_SERVICES=[
{id:'extra_drone',name:'Drone Shoot',price:5000},
{id:'extra_day',name:'Extra Shoot Day',price:8000},
{id:'extra_photographer',name:'Extra Photographer',price:4000},
{id:'extra_videographer',name:'Extra Videographer',price:5000},
{id:'extra_album',name:'Extra Album',price:3000},
{id:'extra_reel',name:'Extra Reel',price:2000},
{id:'extra_photos',name:'Extra Edited Photos',price:1000}
];
if(!db.extraServices) db.extraServices=DEFAULT_EXTRA_SERVICES.slice();
const DEFAULT_EXPENSE_CATEGORIES=['Photographer','Videographer','Editor','Drone Operator','Travel / Fuel','Food / Stay','Album / Printing','Equipment Rental','Assistant','Marketing','Other'];
if(!db.expenseCategories) db.expenseCategories={};
if(!db.expenseCategoryStatus) db.expenseCategoryStatus={};
if(!db.customExpenseCategories) db.customExpenseCategories=[];
if(!db._expenseDefaultsSeeded){db.customers.forEach(c=>{const existing=Array.isArray(db.expenseCategories[c.id])?db.expenseCategories[c.id]:[];db.expenseCategories[c.id]=[...new Set([...DEFAULT_EXPENSE_CATEGORIES,...db.customExpenseCategories,...existing])];});db._expenseDefaultsSeeded=true;save();}
if(!db._expenseMigrated) { db.expenses = db.expenses || []; db._expenseMigrated=true; save(); }
if(!db._paymentMigrated){db.invoices.forEach(i=>{if(Number(i.paid||0)>0&&!db.payments.some(p=>p.invoiceId==i.id))db.payments.push({id:'m'+i.id,date:i.date||new Date().toISOString().slice(0,10),amount:Number(i.paid||0),invoiceId:i.id,customerId:i.customerId,method:'Advance',note:'Migrated from invoice'});});db._paymentMigrated=true;save();}
// Keep invoice paid totals consistent with payment history.
db.invoices.forEach(i=>{let sum=db.payments.filter(p=>p.invoiceId==i.id).reduce((s,p)=>s+Math.max(0,Number(p.amount||0)),0);if(db.payments.some(p=>p.invoiceId==i.id)&&Number(i.paid||0)!==sum)i.paid=Math.min(Number(i.total||0),sum);});save();
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function rkContrastText(hex){
  const h=String(hex||'').replace('#','');
  if(h.length!==6)return '#fff';
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  const lum=(0.2126*r+0.7152*g+0.0722*b)/255;
  return lum>0.68 ? '#17151f' : '#fff';
}
function applyUI(){
  const st=db.settings||{}; const dark=st.theme==='dark';
  document.body.classList.toggle('theme-dark',dark);
  document.body.classList.toggle('theme-light',!dark);
  document.documentElement.style.setProperty('--primary',st.primary||'#6c4df6');

  document.documentElement.style.setProperty('--bg',dark?'#101116':(st.background||'#f5f6fa'));
  document.documentElement.style.setProperty('--card',dark?'#191b22':(st.cardColor||'#ffffff'));
  document.documentElement.style.setProperty('--text',dark?'#f4f4f7':'#20212a');
  document.documentElement.style.setProperty('--muted',dark?'#a5a7b0':'#737784');
  document.documentElement.style.setProperty('--border',dark?'#30333d':'#e8e8ef');
  document.documentElement.style.setProperty('--input-bg',dark?'#14161d':'#fff');
  document.documentElement.style.setProperty('--side',st.sidebar==='light'?(dark?'#191b22':'#fff'):(st.sidebarColor||'#17151f'));
  document.documentElement.style.setProperty('--radius',(Number(st.radius||15))+'px');
  document.documentElement.style.setProperty('--font-size',(Number(st.fontSize||16))+'px');
  document.documentElement.style.setProperty('--font-family',st.fontFamily||'Inter,system-ui,-apple-system,Segoe UI,sans-serif');
  document.documentElement.style.setProperty('--sidebar-width',(Number(st.sidebarWidth||245))+'px');
  const shadow=st.shadow||'soft'; document.documentElement.style.setProperty('--shadow',shadow==='none'?'none':shadow==='strong'?'0 14px 38px rgba(24,22,36,.16)':'0 8px 24px rgba(24,22,36,.06)');
  document.documentElement.style.setProperty('--card-border',st.cardBorder==='off'?'0':'1px solid var(--border)');
  document.documentElement.style.setProperty('--button-radius',st.buttonStyle==='pill'?'999px':st.buttonStyle==='square'?'4px':'10px');
  document.documentElement.style.setProperty('--button-shadow',st.buttonStyle==='raised'?'0 6px 16px rgba(80,60,190,.22)':'none');

}

function showPage(id,btn){if(!guard(id))return;document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');render();}

function renderPackages(){
  packages.innerHTML=`<div class="top"><div><h1>Packages</h1><div class="sub">Create wedding packages and use them directly in invoices</div></div><button class="btn" onclick="openPackage()">+ New Package</button></div>
  <div class="grid cards">${db.packages.map(p=>`<div class="card package-card"><h3>${esc(p.name)}</h3><div class="package-price">${money(p.price)}</div><div>${(p.items||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="package-actions">${menu(`<button onclick="openPackage('${p.id}')">Edit</button><button onclick="sharePackage('${p.id}')">WhatsApp Customer</button><button onclick="usePackageInInvoice('${p.id}')">Use in Bill</button><button class="danger" onclick="deletePackage('${p.id}')">Delete</button>`)}</div></div>`).join('')||'<div class="card empty">No packages yet. Create your first package.</div>'}</div>`;
}
function openPackage(id=null){ if(!actionGuard('packageManage'))return;
  let p=db.packages.find(x=>x.id==id)||{name:'',price:0,items:['Photography','Videography']};
  modal(id?'Edit Package':'New Package',`<div class="formgrid"><div class="full"><label class="label">Package Name</label><input id="p_name" value="${esc(p.name)}" placeholder="Premium Wedding Package"></div><div><label class="label">Price (₹)</label><input id="p_price" type="number" min="0" step="1" value="${Number(p.price||0)}"></div><div class="full"><label class="label">Included Services</label><textarea id="p_items" rows="6" placeholder="One service per line">${esc((p.items||[]).join('\n'))}</textarea></div></div><div style="margin-top:18px;text-align:right"><button class="btn" onclick="savePackage('${id||''}')">Save Package</button></div>`);
}
function savePackage(id){
  let name=p_name.value.trim(),price=Math.max(0,Number(p_price.value||0)),items=p_items.value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!name)return alert('Package name is required.');
  if(price<=0)return alert('Enter a valid package price.');
  if(!items.length)return alert('Add at least one included service.');
  let obj={id:id||('pkg'+Date.now()),name,price,items};
  if(id)db.packages=db.packages.map(x=>x.id==id?obj:x);else db.packages.push(obj);
  save();closeModal();render();
}
function deletePackage(id){if(!actionGuard('packageManage'))return;if(!confirm('Delete this package?'))return;rkMarkCloudDeleted('packages',id);db.packages=db.packages.filter(p=>p.id!=id);save();render();rkCloudDeleteReport(rkCloudDelete('packages',id).then(()=>rkClearCloudDeleted('packages',id)));}

function rkActivityInit(){
  if(!Array.isArray(db.activityLog)) db.activityLog=[];
  if(!db.settings) db.settings={};
  // Robust migration: older broken builds could mark the backfill complete while the log was empty.
  // Rebuild once whenever the log is empty but studio data exists.
  const hasStudioData=(db.customers||[]).length+(db.packages||[]).length+(db.events||[]).length+(db.invoices||[]).length+(db.payments||[]).length+(db.expenses||[]).length;
  const needsBackfill=Number(db.settings.activityLogSchemaVersion||0)<2 || (db.activityLog.length===0 && hasStudioData>0);
  if(needsBackfill){
    const add=(type,action,detail,id,at)=>db.activityLog.push({id:makeId('log'),type,action,detail:String(detail||''),entityId:String(id||''),userId:currentUser?.id||'',user:currentUser?.name||currentUser?.username||'System',at:at||new Date().toISOString()});
    (db.customers||[]).forEach(c=>add('Customer','Customer in studio',c.name,c.id,c.createdAt||new Date().toISOString()));
    (db.packages||[]).forEach(x=>add('Package','Package available',x.name,x.id));
    (db.events||[]).forEach(x=>add('Shoot','Shoot scheduled',`${x.name||'Shoot'} · ${x.date||''}`,x.id,x.date?new Date(x.date+'T12:00:00').toISOString():undefined));
    (db.invoices||[]).forEach(x=>add('Invoice','Invoice created',`${x.number||x.id||'Invoice'} · ${customerName(x.customerId)}`,x.id,x.date?new Date(x.date+'T12:00:00').toISOString():undefined));
    (db.payments||[]).forEach(x=>add('Payment','Payment received',`${money(x.amount||0)} · ${customerName((db.invoices||[]).find(i=>i.id===x.invoiceId)?.customerId)}`,x.id,x.date?new Date(x.date+'T12:00:00').toISOString():undefined));
    (db.expenses||[]).forEach(x=>add('Expense','Expense recorded',`${money(x.amount||0)} · ${x.category||''}`,x.id,x.date?new Date(x.date+'T12:00:00').toISOString():undefined));
    db.settings.activityBackfilled=true;
    db.settings.activityLogSchemaVersion=2;
    db.activityLog.sort((a,b)=>new Date(b.at)-new Date(a.at));
    if(db.activityLog.length>1000) db.activityLog=db.activityLog.slice(0,1000);
    save();
  }
}
function rkLog(type,action,detail='',entityId=''){
  rkActivityInit();
  db.activityLog.unshift({id:makeId('log'),type,action,detail:String(detail||''),entityId:String(entityId||''),userId:currentUser?.id||'',user:currentUser?.name||currentUser?.username||'System',at:new Date().toISOString()});
  if(db.activityLog.length>1000)db.activityLog.length=1000;
  save();
}

function rkInstallAuditWrappers(){
  const specs=[['saveCustomer','Customer','Customer saved','customers'],['deleteCustomer','Customer','Customer deleted','customers'],['saveEvent','Shoot','Shoot saved','events'],['deleteEvent','Shoot','Shoot deleted','events'],['saveInvoice','Invoice','Invoice saved','invoices'],['deleteInvoice','Invoice','Invoice deleted','invoices'],['savePayment','Payment','Payment received','payments'],['deletePayment','Payment','Payment deleted','payments'],['saveExpense','Expense','Expense saved','expenses'],['deleteExpense','Expense','Expense deleted','expenses'],['savePackage','Package','Package saved','packages'],['deletePackage','Package','Package deleted','packages'],['saveUser','User','User saved','users'],['deleteUser','User','User deleted','users']];
  specs.forEach(([name,type,label,key])=>{
    const fn=window[name];
    if(typeof fn!=='function'||fn.__rkAudit)return;
    const w=function(...args){
      const beforeIds=new Set((db[key]||[]).map(x=>String(x.id)));
      const r=fn.apply(this,args);
      try{
        let id=args[0]||'';
        const arr=db[key]||[];
        let item=id?arr.find(x=>String(x.id)===String(id)):arr.find(x=>!beforeIds.has(String(x.id)))||arr[arr.length-1];
        let detail=item?.name||item?.number||item?.description||item?.category||'';
        if(!detail&&item?.customerId) detail=customerName(item.customerId);
        if(!detail&&item?.invoiceId) detail=item.invoiceId;
        if(name.startsWith('delete')) detail=detail||id;
        rkLog(type,label,detail,id||item?.id||'');
        if(document.getElementById('activity')&&!document.getElementById('activity').classList.contains('hidden')) renderActivity();
      }catch(e){console.error('Activity audit error',e)}
      return r;
    };
    w.__rkAudit=true;
    window[name]=w;
  });
}

function rkMarkCloudDeleted(table,id){window.rkCloudDeleteTombstones[`${table}:${String(id)}`]=Date.now();}

async function rkCloudDelete(table,id){
  if(!window.RK_SUPABASE||sessionStorage.getItem('rkStudioAuthProvider')!=='supabase')return;
  const {error}=await window.RK_SUPABASE.from(table).delete().eq('id',String(id));
  if(error)throw new Error(`${table}: ${error.message||JSON.stringify(error)}`);
}
async function rkCloudDeleteWhere(table,column,value){
  if(!window.RK_SUPABASE||sessionStorage.getItem('rkStudioAuthProvider')!=='supabase')return;
  const {error}=await window.RK_SUPABASE.from(table).delete().eq(column,String(value));
  if(error)throw new Error(`${table}.${column}: ${error.message||JSON.stringify(error)}`);
}
function rkCloudDeleteReport(p){
  Promise.resolve(p).catch(e=>{
    window.RK_CLOUD_LAST_ERROR=e?.message||String(e);
    console.warn('Cloud delete failed:',e);
    if(typeof rkToast==='function')rkToast('Deleted locally · cloud delete failed','error');

}

function deleteCustomer(id){
  if(!actionGuard('customerDelete'))return;
  if(!confirm('Delete this customer?'))return;
  const invIds=[...new Set(db.invoices.filter(i=>i.customerId==id).map(i=>String(i.id)))];
  const shootIds=db.events.filter(e=>e.customerId==id).map(e=>String(e.id));
  const expenseIds=db.expenses.filter(e=>e.customerId==id).map(e=>String(e.id));
  rkMarkCloudDeleted('customers',id);shootIds.forEach(x=>rkMarkCloudDeleted('shoots',x));expenseIds.forEach(x=>rkMarkCloudDeleted('expenses',x));invIds.forEach(x=>rkMarkCloudDeleted('invoices',x));
  db.customers=db.customers.filter(c=>c.id!=id);
  db.events=db.events.filter(e=>e.customerId!=id);
  db.invoices=db.invoices.filter(i=>i.customerId!=id);
  db.payments=db.payments.filter(p=>!invIds.includes(String(p.invoiceId)));
  delete db.expenseCategories[id];delete db.expenseCategoryStatus[id];
  db.expenses=db.expenses.filter(e=>e.customerId!=id);
  save();render();
  if(window.RK_SUPABASE&&sessionStorage.getItem('rkStudioAuthProvider')==='supabase'){
    rkCloudDeleteReport((async()=>{
      for(const sid of shootIds)await rkCloudDelete('shoots',sid);
      for(const eid of expenseIds)await rkCloudDelete('expenses',eid);
      for(const iid of invIds){await rkCloudDeleteWhere('payments','invoice_id',iid);await rkCloudDeleteWhere('invoice_items','invoice_id',iid);await rkCloudDelete('invoices',iid);}
      await rkCloudDelete('customers',id);
      rkClearCloudDeleted('customers',id);shootIds.forEach(x=>rkClearCloudDeleted('shoots',x));expenseIds.forEach(x=>rkClearCloudDeleted('expenses',x));invIds.forEach(x=>rkClearCloudDeleted('invoices',x));
    })());
  }
}

function compressPaymentImage(file,maxSize=1400,quality=0.72){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/')) return reject(new Error('Only image files are supported.'));
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height,scale=Math.min(1,maxSize/Math.max(w,h));
        w=Math.round(w*scale);h=Math.round(h*scale);
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        resolve({name:file.name,type:'image/jpeg',data:canvas.toDataURL('image/jpeg',quality)});
      };
      img.onerror=()=>reject(new Error('Could not read image.'));img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Could not read file.'));reader.readAsDataURL(file);
  });
}
async function handlePaymentMedia(input){
  const files=[...input.files||[]];
  const out=[]; const maxFiles=5;
  if(files.length>maxFiles){alert('You can attach up to 5 payment screenshots.');input.value='';return;}
  try{
    for(const f of files){
      if(f.size>8*1024*1024) throw new Error(f.name+' is larger than 8 MB.');
      out.push(await compressPaymentImage(f));
    }
    window._paymentMedia=out;
    const box=document.getElementById('paymentMediaPreview');
    if(box)box.innerHTML=out.map((x,i)=>`<div style="position:relative;display:inline-block;margin:6px"><img src="${x.data}" alt="Payment screenshot" style="width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border)"><button type="button" class="small danger" onclick="removePaymentMedia(${i})" style="position:absolute;top:3px;right:3px;padding:2px 6px">✕</button></div>`).join('');
  }catch(e){alert(e.message);input.value='';window._paymentMedia=[];}
}
function removePaymentMedia(index){window._paymentMedia=(window._paymentMedia||[]).filter((_,i)=>i!==index);const box=document.getElementById('paymentMediaPreview');if(box)box.innerHTML=(window._paymentMedia||[]).map((x,i)=>`<div style="position:relative;display:inline-block;margin:6px"><img src="${x.data}" alt="Payment screenshot" style="width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border)"><button type="button" class="small danger" onclick="removePaymentMedia(${i})" style="position:absolute;top:3px;right:3px;padding:2px 6px">✕</button></div>`).join('');}
async function viewPaymentMedia(paymentId){
  const payment=db.payments.find(x=>x.id==paymentId);
  if(!payment || !Array.isArray(payment.media) || !payment.media.length){
    alert("Payment screenshot not available."); return;
  }
  const sources=[];
  for(const m of payment.media){
    const raw=typeof m==='string'?m:(m?.data||m?.url||m?.src||m?.path||'');
    if(!raw)continue;
    if(raw.startsWith('data:')||raw.startsWith('blob:')||raw.startsWith('http')){
      sources.push(raw);
    }else if(window.RK_SUPABASE && sessionStorage.getItem('rkStudioAuthProvider')==='supabase'){
      try{
        const {data,error}=await window.RK_SUPABASE.storage.from('payment-media').createSignedUrl(raw,3600);
        if(!error&&data?.signedUrl)sources.push(data.signedUrl);
      }catch(e){}
    }
  }
  if(!sources.length){alert("Payment screenshot not available.");return;}
  document.getElementById("paymentMediaViewer")?.remove();
  const wrap=document.createElement("div");wrap.id="paymentMediaViewer";wrap.className="payment-media-viewer";
  wrap.innerHTML=`<div class="payment-media-backdrop" onclick="closePaymentMedia(event)"><div class="payment-media-dialog" onclick="event.stopPropagation()"><button class="payment-media-close" type="button" onclick="document.getElementById('paymentMediaViewer')?.remove()">✕</button><div style="color:#fff;text-align:center;margin-bottom:10px;font-weight:700">Payment Screenshot${sources.length>1?` (${sources.length})`:''}</div><div style="display:flex;flex-direction:column;gap:14px;align-items:center;max-height:82vh;overflow:auto;padding:4px">${sources.map((src,idx)=>`<img src="${src}" alt="Payment Screenshot ${idx+1}" style="display:block;max-width:100%;max-height:75vh;object-fit:contain;border-radius:8px" onerror="this.outerHTML='<div style=&quot;color:#fff;padding:30px&quot;>Unable to display screenshot ${idx+1}.</div>'">`).join('')}</div></div></div>`;
  document.body.appendChild(wrap);
}

async function savePayment(invoiceId){
  if(!actionGuard('paymentAdd'))return;
  let i=db.invoices.find(x=>x.id==invoiceId);if(!i)return alert('Invoice not found.');
  let amount=Math.max(0,Number(pay_amount.value||0)),remaining=Math.max(0,Number(i.total||0)-Number(i.paid||0));
  if(!pay_date.value)return alert('Payment date is required.');
  if(amount<=0)return alert('Enter a valid payment amount.');
  if(amount>remaining)return alert('Payment cannot be greater than remaining amount.');

  const mediaOut=[];
  const rawMedia=Array.isArray(window._paymentMedia)?window._paymentMedia:[];
  if(window.RK_SUPABASE && sessionStorage.getItem('rkStudioAuthProvider')==='supabase' && rawMedia.length){
    try{
      const uid=(await window.RK_SUPABASE.auth.getUser()).data?.user?.id||'user';
      const paymentId='pay'+Date.now();
      for(let idx=0;idx<rawMedia.length;idx++){
        const item=rawMedia[idx];
        if(!item?.data)continue;
        const blob=await (await fetch(item.data)).blob();
        const path=`${uid}/${invoiceId}/${paymentId}-${idx+1}.jpg`;
        const {error}=await window.RK_SUPABASE.storage.from('payment-media').upload(path,blob,{contentType:'image/jpeg',upsert:true});
        if(error)throw error;
        mediaOut.push({path,name:item.name||`payment-${idx+1}.jpg`,type:'image/jpeg'});
      }
    }catch(e){
      console.error('Payment media upload failed:',e);
      alert('Payment saved locally, but one or more screenshots could not be uploaded to cloud storage.');
      mediaOut.splice(0);
      rawMedia.forEach(x=>{if(x?.data)mediaOut.push({data:x.data,name:x.name||'payment.jpg',type:x.type||'image/jpeg'})});
    }
  }else{
    rawMedia.forEach(x=>{if(x?.data)mediaOut.push(x)});
  }

  let payment={id:'pay'+Date.now(),date:pay_date.value,amount,invoiceId,customerId:i.customerId,method:pay_method.value,note:pay_note.value.trim()||'Payment received',media:mediaOut};
  db.payments.push(payment);
  i.paid=Number(i.paid||0)+amount;if(i.paid>=Number(i.total||0))i.paid=Number(i.total||0);

  // Activity trail.
  if(typeof rkLog==='function')rkLog('Payment','Payment received',`${money(amount)} · ${i.number||invoiceId}`,payment.id);
  save();closeModal();render();openInvoiceView(invoiceId);
}

async function sendInvoicePdfWhatsApp(invoiceId){
  const i=db.invoices.find(x=>String(x.id)===String(invoiceId));
  if(!i){alert("Invoice not found.");return;}
  const c=db.customers.find(x=>String(x.id)===String(i.customerId))||{};
  if(!c.phone){alert("Customer WhatsApp number is missing.");return;}

  const studio=db.settings?.studio||"RK Studio";
  const defaultMsg=window.waTemplate
    ? window.waTemplate("invoice",{
        customer:c.name||"Customer",
        studio,
        invoice:i.number||"",
        total:money(i.total),
        paid:money(i.paid),
        remaining:money(Math.max(0,Number(i.total||0)-Number(i.paid||0))),
        due:i.dueDate?`Due Date: ${i.dueDate}`:""
      })
    : `Hello ${c.name||"Customer"} ji 👋

Please find your invoice from ${studio}.

Invoice: ${i.number||""}
Total Amount: ${money(i.total)}
Paid Amount: ${money(i.paid)}
Remaining Amount: ${money(Math.max(0,Number(i.total||0)-Number(i.paid||0)))}

Please find the complete invoice PDF attached.

Thank you,
${studio}`;

  const overlay=document.createElement("div");
  overlay.className="wa-custom-overlay";
  overlay.innerHTML=`<div class="wa-custom-box">
    <div class="wa-custom-head">
      <div><h2>📄 Send Invoice PDF on WhatsApp</h2>
      <p>The PDF will be generated exactly like Print / Save PDF.</p></div>
      <button type="button" class="wa-close">×</button>
    </div>
    <div class="wa-summary"><b>${esc(c.name||"Customer")}</b><span>${esc(i.number||"")}</span></div>
    <label class="wa-label">Custom WhatsApp Message</label>
    <textarea class="wa-message" rows="11"></textarea>
    <div class="wa-custom-actions">
      <button type="button" class="secondary wa-cancel">Cancel</button>
      <button type="button" class="btn wa-send">📱 Generate PDF & Send</button>
    </div>
    <div class="muted" style="margin-top:9px;font-size:11px">
      The generated PDF uses the same invoice content and layout as Print / Save PDF, including Payment Structure and Photography Agreement.
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const ta=overlay.querySelector(".wa-message");
  ta.value=defaultMsg; ta.focus();
  const close=()=>overlay.remove();
  overlay.querySelector(".wa-close").onclick=close;
  overlay.querySelector(".wa-cancel").onclick=close;
  overlay.addEventListener("click",e=>{if(e.target===overlay)close();});

  overlay.querySelector(".wa-send").onclick=async()=>{
    const msg=ta.value.trim();
    if(!msg){alert("Please enter a message.");ta.focus();return;}

    const btn=overlay.querySelector(".wa-send");
    btn.disabled=true;
    btn.textContent="⏳ Creating PDF…";

    try{
      // IMPORTANT: This is the same generator used by the Print/Save PDF path.
      const pdfBlob=await rkCreateInvoicePDFBlob(invoiceId);
      const safeNumber=String(i.number||invoiceId).replace(/[^a-z0-9_-]/gi,"-");
      const file=new File([pdfBlob],`Invoice-${safeNumber}.pdf`,{type:"application/pdf"});
      const phone=String(c.phone).replace(/\D/g,"");
      const intl=phone.length===10?"91"+phone:phone;

      // Mobile: native share sheet lets the user choose WhatsApp AND attach the PDF.
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({
            title:`Invoice ${i.number||""} — ${studio}`,
            text:msg,
            files:[file]
          });
          close();
          if(typeof rkLog==="function") rkLog("WhatsApp","Invoice PDF shared",`${i.number||""} · ${c.name||""}`,i.id);
          return;
        }catch(err){
          if(err?.name==="AbortError"){
            btn.disabled=false;
            btn.textContent="📱 Generate PDF & Send";
            return;
          }
        }
      }

      // Desktop/fallback: download the EXACT same PDF, then open WhatsApp
      // with the custom message so the downloaded PDF can be attached.
      const url=URL.createObjectURL(pdfBlob);
      const a=document.createElement("a");
      a.href=url;
      a.download=file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);

      window.open(`https://wa.me/${intl}?text=${encodeURIComponent(msg)}`,"_blank");
      close();
      if(typeof rkLog==="function") rkLog("WhatsApp","Invoice PDF prepared",`${i.number||""} · ${c.name||""}`,i.id);
    }catch(e){
      console.error(e);
      btn.disabled=false;
      btn.textContent="📱 Generate PDF & Send";
      alert("PDF create nahi ho paya. Please try Print / Save PDF once.");
    }
  };
}
async function openInvoiceView(id){

     sessionStorage.getItem('rkStudioAuthProvider')==='supabase'){

        .from('customers')

          name:cr.name||'',
          phone:cr.phone||'',
          email:cr.email||'',
          address:cr.address||'',
          notes:cr.notes||'',
          photo:'',
          ...(cr.custom_data||{})

        c=mapped;
        const idx=(db.customers||[]).findIndex(x=>String(x.id)===String(mapped.id));

      db.customers.push(c);
    }
  }

  // Last-resort compatibility for older local invoices whose customer id was
  // not preserved during an earlier migration: infer only when exactly one

    c=db.customers[0];
  }
  c=c||{};
  const events=(db.events||[]).filter(e=>String(e.customerId)===String(i.customerId)).sort((a,b)=>(String(a.date)+String(a.time)).localeCompare(String(b.date)+String(b.time)));

      address:c.address||'',
      venue:c.venue||''
    };

  }
  const subtotal=(i.items||[]).reduce((s,x)=>s+Number(x.qty||0)*Number(x.price||0),0);

    let serviceDetails="";
    if(/package/i.test(String(x.desc||"")) && services.length){

    return `<tr><td><div class="invoice-line-service-name">${esc(x.desc||"")}</div>${serviceDetails}</td><td>${Number(x.qty||0)}</td><td>${money(x.price)}</td><td>${money(Number(x.qty||0)*Number(x.price||0))}</td></tr>`;

    <div class="invoice-shoot-row">

    <td>${esc(p.date||"")}</td><td><b>${money(p.amount)}</b></td><td>${esc(p.method||"")}</td><td>${esc(p.note||"")}</td>
    <td>${p.media?.length?`<button class="small" onclick="viewPaymentMedia('${p.id}')">📎 ${p.media.length}</button>`:"—"}</td>
  </tr>`).join("") : `<tr><td colspan="5" class="empty">No payments recorded</td></tr>`;

  invoices.innerHTML=`<div class="invoice-actions">
    <button class="btn secondary print-hide" onclick="renderInvoices()">← Back</button>
    <button class="btn secondary print-hide" onclick="printInvoiceClean()">Print / Save PDF</button>

  </div>
  <div class="invoice">
    <div class="invoicehead">
      <div>${db.settings?.companyLogo?`<img class="rk-invoice-logo" src="${db.settings.companyLogo}" alt="Company Logo">`:``}
        <h2>${esc(db.settings?.studio||"RK Studio")}</h2>

      <div class="right"><b>INVOICE</b><br>${esc(i.number||"")}<br>${esc(i.date||"")}</div>

    <div class="invoice-customer-block">${typeof customerAvatar==="function"?customerAvatar(c):""}<div><b>Bill To</b><br>${esc(c.name||"")}<br>${esc(c.phone||"")}<br>${esc(c.venue||"")}</div></div>

async function sendWhatsApp(invoiceId){
  const i=db.invoices.find(x=>String(x.id)===String(invoiceId));
  if(!i){alert("Invoice not found.");return;}

  let c=db.customers.find(x=>String(x.id)===String(i.customerId))||null;

  // Cloud-first lookup for migrated/remote invoices whose customer is not in
  // the local cache (or whose phone field was not hydrated).
  if((!c || !String(c.phone||'').trim()) &&
     i.customerId &&
     window.RK_SUPABASE &&
     sessionStorage.getItem('rkStudioAuthProvider')==='supabase'){
    try{
      const {data:cr,error:ce}=await window.RK_SUPABASE
        .from('customers')
        .select('id,name,phone,email,address,notes,photo_path,custom_data')
        .eq('id',String(i.customerId))
        .maybeSingle();

      if(!ce && cr){
        const x=cr.custom_data||{};
        const mapped={
          id:String(cr.id),
          name:cr.name||'',
          phone:cr.phone||x.phone||'',
          email:cr.email||x.email||'',
          address:cr.address||'',
          notes:cr.notes||'',
          weddingDate:x.weddingDate||'',
          venue:x.venue||'',
          package:x.package||'',
          photo:x.photo||''
        };
        c=mapped;
        const idx=(db.customers||[]).findIndex(v=>String(v.id)===String(mapped.id));
        if(idx>=0)db.customers[idx]=mapped; else db.customers.push(mapped);
        if(!RK_SERVER_ONLY) localStorage.setItem(KEY,JSON.stringify(db));
      }
    }catch(e){
      console.warn('WhatsApp customer lookup failed:',e);
    }
  }

  // If the invoice contains a repaired customer snapshot, use it as fallback.
  if((!c || !String(c.phone||'').trim()) && i.customerSnapshot){
    c=Object.assign({},c||{},i.customerSnapshot);
  }

  const name=c?.name||"Customer";
  const remaining=Math.max(0,Number(i.total||0)-Number(i.paid||0));
  const studio=db.settings?.studio||"RK Studio";
  const defaultMsg=`Hello ${name},

This is a payment reminder from ${studio} regarding your invoice ${i.number||""}.

Total Amount: ${money(i.total)}
Paid Amount: ${money(i.paid)}
Remaining Amount: ${money(remaining)}${i.dueDate?`\nDue Date: ${i.dueDate}`:""}

Kindly clear the remaining amount as per the agreed payment schedule.

Thank you,
${studio}`;

  const overlay=document.createElement("div");
  overlay.className="wa-custom-overlay";
  overlay.innerHTML=`<div class="wa-custom-box">
    <div class="wa-custom-head">
      <div><h2>Send Payment Reminder</h2><p>Customize the WhatsApp message before sending.</p></div>
      <button type="button" class="wa-close">×</button>
    </div>
    <div class="wa-summary">
      <b>${esc(name)}</b><span>Remaining: ${money(remaining)}</span>
    </div>
    <label class="wa-label">Custom Message</label>
    <textarea class="wa-message" rows="11"></textarea>
    <div class="wa-custom-actions">
      <button type="button" class="secondary wa-cancel">Cancel</button>
      <button type="button" class="btn wa-send">📱 Send on WhatsApp</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const ta=overlay.querySelector(".wa-message");
  ta.value=defaultMsg;
  ta.focus();

  const close=()=>overlay.remove();
  overlay.querySelector(".wa-close").onclick=close;
  overlay.querySelector(".wa-cancel").onclick=close;
  overlay.addEventListener("click",e=>{if(e.target===overlay)close();});

  overlay.querySelector(".wa-send").onclick=()=>{
    const msg=ta.value.trim();
    if(!msg){alert("Please enter a message.");ta.focus();return;}
    const phone=String(c?.phone||"").replace(/\D/g,"");
    if(!phone){
      alert("Customer WhatsApp number is missing. Please add the customer's phone number in CRM and save.");
      return;
    }
    const intl=phone.length===10?"91"+phone:phone;
    window.open("https://wa.me/"+intl+"?text="+encodeURIComponent(msg),"_blank");
    close();
  };
}

function categoriesForCustomer(cid){
  if(!cid) return [...DEFAULT_EXPENSE_CATEGORIES,...db.customExpenseCategories.filter(x=>!DEFAULT_EXPENSE_CATEGORIES.includes(x))];
  return Array.isArray(db.expenseCategories[cid]) ? db.expenseCategories[cid] : [...DEFAULT_EXPENSE_CATEGORIES];
}
function manageExpenseCategories(cid){
  const c=db.customers.find(x=>x.id==cid); if(!c)return;
  const cats=categoriesForCustomer(cid);
  modal('Expense Categories — '+c.name,`<p class="muted">All standard categories are enabled by default. Turn categories on/off for this customer.</p><div id="catList">${[...new Set([...DEFAULT_EXPENSE_CATEGORIES,...db.customExpenseCategories])].map(x=>`<label style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)"><input type="checkbox" class="cat-check" value="${esc(x)}" ${cats.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}</div><div class="formgrid" style="margin-top:14px"><div class="full"><label class="label">Add custom category</label><input id="new_cat" placeholder="e.g. Makeup Artist"></div></div><div style="margin-top:16px;text-align:right"><button class="btn" onclick="saveExpenseCategories('${cid}')">Save Categories</button></div>`);
}
function saveExpenseCategories(cid){
  const checked=[...document.querySelectorAll('.cat-check:checked')].map(x=>x.value);
  const custom=(document.getElementById('new_cat')?.value||'').trim();
  if(custom){if(!db.customExpenseCategories.includes(custom))db.customExpenseCategories.push(custom);checked.push(custom)}
  db.expenseCategories[cid]=[...new Set(checked)];
  save();closeModal();render();
}
function customerFinancials(cid){
  const inv=db.invoices.filter(i=>i.customerId==cid);
  const revenue=inv.reduce((s,i)=>s+Number(i.total||0),0);
  const collected=inv.reduce((s,i)=>s+Number(i.paid||0),0);
  const expenses=db.expenses.filter(e=>e.customerId==cid);
  const cost=expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const profit=revenue-cost;
  return {inv,revenue,collected,balance:Math.max(0,revenue-collected),expenses,cost,profit,margin:revenue?profit/revenue*100:0};
}

async function rkCloudAdminCall(action,payload={}){
  if(!window.RK_SUPABASE||sessionStorage.getItem('rkStudioAuthProvider')!=='supabase'){
    return {cloud:false};
  }

  const {data:sessionData,error:sessionError}=await window.RK_SUPABASE.auth.getSession();
  const session=sessionData?.session;
  if(sessionError||!session?.access_token){
    throw new Error('Supabase session expired. Please logout and login again.');
  }

  // Explicitly pass the user's JWT. supabase.functions.invoke normally forwards
  // it automatically, but making it explicit avoids auth mismatches after a
  // site/SDK transition and lets the Edge Function's auth context verify the
  // actual signed-in user.
  const headers={
    Authorization:`Bearer ${session.access_token}`,
    apikey:window.RK_SUPABASE_PUBLISHABLE_KEY
  };

  const {data,error}=await window.RK_SUPABASE.functions.invoke(
    'rk-admin-users',
    {body:{action,...payload},headers}
  );

  if(error){
    const detail=error.context?.body || error.message || 'Cloud user operation failed.';
    let message=typeof detail==='string'?detail:JSON.stringify(detail);
    throw new Error(message);
  }
  if(data?.error)throw new Error(data.error);
  return {cloud:true,data};
}

    .replace(/\{\{role\}\}/g,roleName||"");
  title.textContent=replaceTokens(cfg.title);
  msg.textContent=replaceTokens(cfg.message);
  if(bar){
    bar.style.animation="none";
    void bar.offsetWidth;
    bar.style.animation=`rkWelcomeProgress ${Math.max(700,Number(cfg.duration)||1400)}ms linear forwards`;
  }
  ov.classList.add("show");
  ov.setAttribute("aria-hidden","false");
  const wait=Math.max(700,Number(cfg.duration)||1400);
  if(preview){
    setTimeout(()=>{
      ov.classList.remove("show");
      ov.setAttribute("aria-hidden","true");
    },wait);
  }
  return true;
}

    const d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');

const AUTO_BACKUP_KEY='rkStudioAutoBackup';
const AUTO_BACKUP_ENABLED_KEY='rkStudioAutoBackupEnabled';
const AUTO_BACKUP_INTERVAL=15*60*1000;
let autoBackupTimer=null;
function createAutoBackupSnapshot(showToast=false){
  if(RK_SERVER_ONLY){updateAutoBackupStatus();return;}
  try{
    const payload={app:'RK Studio',version:'v133',backupDate:new Date().toISOString(),storageKey:KEY,data:db};
    localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(payload));
    localStorage.setItem(AUTO_BACKUP_KEY+'_time',payload.backupDate);
    updateAutoBackupStatus();
    if(showToast&&typeof toast==='function')toast('Auto backup saved.');
  }catch(e){if(showToast)alert('Auto backup failed. Please check browser storage space.');}
}
function updateAutoBackupStatus(){
  const el=document.getElementById('rkAutoBackupStatus'); if(!el)return;
  const enabled=localStorage.getItem(AUTO_BACKUP_ENABLED_KEY)!=='0';
  const t=localStorage.getItem(AUTO_BACKUP_KEY+'_time');
  el.textContent=enabled?(t?'Last auto backup: '+new Date(t).toLocaleString():'Auto backup enabled — first backup will be saved now.'):'Auto backup is off.';
  const cb=document.getElementById('rkAutoBackupToggle'); if(cb)cb.checked=enabled;
}
function startAutoBackup(){
  clearInterval(autoBackupTimer);
  if(localStorage.getItem(AUTO_BACKUP_ENABLED_KEY)==='0'){updateAutoBackupStatus();return;}
  createAutoBackupSnapshot(false);
  autoBackupTimer=setInterval(()=>{if(document.visibilityState!=='hidden')createAutoBackupSnapshot(false);},AUTO_BACKUP_INTERVAL);
  updateAutoBackupStatus();
}
function toggleAutoBackup(enabled){
  localStorage.setItem(AUTO_BACKUP_ENABLED_KEY,enabled?'1':'0');
  if(enabled){createAutoBackupSnapshot(true);startAutoBackup();}
  else{clearInterval(autoBackupTimer);autoBackupTimer=null;updateAutoBackupStatus();}
}
function restoreLatestAutoBackup(){
  if(RK_SERVER_ONLY)return alert('Server-only mode is enabled. Use the server-backed restore workflow.');
  if(!hasPermission('settings'))return alert('You do not have permission to restore data.');
  try{
    const raw=localStorage.getItem(AUTO_BACKUP_KEY); if(!raw)return alert('No auto backup is available yet.');
    const parsed=JSON.parse(raw),incoming=parsed?.data;
    if(!incoming||typeof incoming!=='object'||!Array.isArray(incoming.customers)||!Array.isArray(incoming.invoices)||!Array.isArray(incoming.events))throw new Error('Invalid auto backup');
    const when=parsed.backupDate?new Date(parsed.backupDate).toLocaleString():'unknown time';
    if(!confirm('Restore the auto backup from '+when+'? Current RK Studio data will be replaced.'))return;
    db=incoming;save();alert('Auto backup restored successfully. RK Studio will reload now.');location.reload();
  }catch(e){alert('Auto backup could not be restored.');}
}
function restoreStudioData(event){
  if(!hasPermission('settings')){event.target.value='';return alert('You do not have permission to restore data.');}
  const file=event.target.files?.[0]; if(!file)return;
  const input=event.target;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=parsed&&parsed.data?parsed.data:parsed;
      if(!incoming||typeof incoming!=='object'||!Array.isArray(incoming.customers)||!Array.isArray(incoming.invoices)||!Array.isArray(incoming.events))throw new Error('Invalid backup');
      if(!confirm('Restore this backup? Current RK Studio data in this browser will be replaced.')){input.value='';return;}
      const required=['settings','customers','events','invoices','packages','payments','expenses','users','roles'];
      required.forEach(k=>{if(!(k in incoming))incoming[k]=Array.isArray(db[k])?[]:(k==='settings'?{}:{});});
      db=incoming;save();alert('Backup restored successfully. RK Studio will reload now.');location.reload();
    }catch(e){alert('Invalid RK Studio backup file. Please select a backup created by this app.');}
    input.value='';
  };
  reader.readAsText(file);
}

async function passwordHash(value){
  const data=new TextEncoder().encode(String(value));
  const digest=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function login(ev){
  if(window.rkResetAutoLogout) window.rkResetAutoLogout();
  ev.preventDefault();
  const loginValue=(document.getElementById('loginUsername').value||'').trim();
  const pw=document.getElementById('loginPassword').value||'';
  const loginError=document.getElementById('loginError');
  loginError.textContent='';

  if(window.RK_SUPABASE){
    try{
      let email=loginValue;
      if(!email.includes('@')){
        const {data:pmatch,error:perr}=await window.RK_SUPABASE
          .from('profiles').select('id,username,email,role,name,active')
          .eq('username',loginValue.toLowerCase()).maybeSingle();
        if(!perr && pmatch?.email) email=pmatch.email;
      }
      if(email.includes('@')){
        const {data,error}=await window.RK_SUPABASE.auth.signInWithPassword({email,password:pw});
        if(!error && data?.user){
          const {data:profile}=await window.RK_SUPABASE
            .from('profiles')
            .select('id,username,name,role,active,phone,email,avatar_url')
            .eq('id',data.user.id).maybeSingle();
          if(profile?.active===false){
            await window.RK_SUPABASE.auth.signOut();
            loginError.textContent='This account is disabled.';
            return;
          }
          const localUser=(db.users||[]).find(u=>String(u.username||'').toLowerCase()===String(profile?.username||loginValue).toLowerCase());
          currentUser=Object.assign({},localUser||{},{
            id:data.user.id,
            username:profile?.username||localUser?.username||email.split('@')[0],
            name:profile?.name||localUser?.name||email.split('@')[0],
            role:profile?.role||localUser?.role||'photographer',
            active:profile?.active!==false,
            email:profile?.email||email
          });
          sessionStorage.setItem('rkStudioUserId',data.user.id);
          sessionStorage.setItem('rkStudioAuthenticated','1');
          sessionStorage.setItem('rkStudioAuthProvider','supabase');
          document.getElementById('loginUsername').value='';
          document.getElementById('loginPassword').value='';
          if(window.rkCloudHydratePhase2) await window.rkCloudHydratePhase2();
          showWelcomeThenApp();
          return;
        }
      }
    }catch(e){
      console.warn('Supabase login unavailable; using local fallback.',e);
    }
  }

  const username=loginValue.toLowerCase();
  const user=(db.users||[]).find(u=>String(u.username||'').toLowerCase()===username && u.active!==false);
  if(!user || await passwordHash(pw)!==user.passwordHash){
    loginError.textContent='Incorrect username or password.';
    return;
  }
  currentUser=user;
  sessionStorage.setItem('rkStudioUserId',user.id);
  sessionStorage.setItem('rkStudioAuthenticated','1');
  sessionStorage.setItem('rkStudioAuthProvider','local');
  document.getElementById('loginUsername').value='';
  document.getElementById('loginPassword').value='';
  showWelcomeThenApp();
}
async function logout(){
  try{ if(window.RK_SUPABASE && sessionStorage.getItem('rkStudioAuthProvider')==='supabase') await window.RK_SUPABASE.auth.signOut(); }catch(e){}
  sessionStorage.removeItem('rkStudioAuthenticated');

async function changePassword(){
  const cur=document.getElementById('currentPassword')?.value||'';
  const next=document.getElementById('newPassword')?.value||'';
  const confirmPw=document.getElementById('confirmPassword')?.value||'';
  if(next.length<6)return alert('New password must be at least 6 characters.');
  if(next!==confirmPw)return alert('New password and confirmation do not match.');

  if(window.RK_SUPABASE&&sessionStorage.getItem('rkStudioAuthProvider')==='supabase'){
    try{
      const {error}=await window.RK_SUPABASE.auth.updateUser({password:next});
      if(error)throw error;
      document.getElementById('currentPassword').value='';
      document.getElementById('newPassword').value='';
      document.getElementById('confirmPassword').value='';
      alert('Password changed successfully.');
      return;
    }catch(e){alert('Cloud password change failed: '+e.message);return;}
  }

  const expected=currentUser?.passwordHash||db.settings.passwordHash||'03ac674216e3f15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
  if(await passwordHash(cur)!==expected)return alert('Current password is incorrect.');
  const nh=await passwordHash(next); if(currentUser){const u=db.users.find(x=>x.id===currentUser.id);if(u){u.passwordHash=nh;currentUser=u;}} db.settings.passwordHash=nh;
  save();
  document.getElementById('currentPassword').value='';document.getElementById('newPassword').value='';document.getElementById('confirmPassword').value='';
  alert('Password changed successfully.');
}

async function restoreCloudSession(){
  try{
    if(!window.RK_SUPABASE)return false;
    const {data,error}=await window.RK_SUPABASE.auth.getSession();
    if(error||!data?.session?.user)return false;

    const user=data.session.user;
    const {data:profile,error:profileError}=await window.RK_SUPABASE
      .from('profiles')
      .select('id,username,name,role,active,phone,email,avatar_url')
      .eq('id',user.id)
      .maybeSingle();

    if(profileError)console.warn('Cloud profile restore failed:',profileError);
    if(profile?.active===false){
      await window.RK_SUPABASE.auth.signOut();
      return false;
    }

    const loginEmail=user.email||'';
    const localUser=(db.users||[]).find(u=>
      String(u.id)===String(user.id) ||
      String(u.email||'').toLowerCase()===loginEmail.toLowerCase() ||
      String(u.username||'').toLowerCase()===String(profile?.username||'').toLowerCase()
    );

    currentUser=Object.assign({},localUser||{},{
      id:user.id,
      username:profile?.username||localUser?.username||loginEmail.split('@')[0],
      name:profile?.name||localUser?.name||loginEmail.split('@')[0],
      role:profile?.role||localUser?.role||'photographer',
      active:profile?.active!==false,
      email:profile?.email||loginEmail,
      phone:profile?.phone||localUser?.phone||'',
      avatar_url:profile?.avatar_url||localUser?.avatar_url||''
    });

    sessionStorage.setItem('rkStudioUserId',user.id);
    sessionStorage.setItem('rkStudioAuthenticated','1');
    sessionStorage.setItem('rkStudioAuthProvider','supabase');

    // Refresh cloud data before showing the app, but don't log the user out
    // if one optional sync table is temporarily unavailable.
    try{ await window.rkCloudHydratePhase2?.(); }catch(e){ console.warn('Cloud hydrate on restore skipped:',e); }

    showApp();
    return true;
  }catch(e){
    console.warn('Supabase session restore skipped:',e);
    return false;
  }
}

(async function bootstrapAuth(){
  const provider=sessionStorage.getItem('rkStudioAuthProvider');
  if(provider==='supabase'){
    const restored=await restoreCloudSession();
    if(restored)return;
  }

  const savedUid=sessionStorage.getItem('rkStudioUserId');
  if(sessionStorage.getItem('rkStudioAuthenticated')==='1' && savedUid){
    currentUser=(db.users||[]).find(u=>String(u.id)===String(savedUid) && u.active!==false)||null;
  }

  if(currentUser)showApp();
  else{
    sessionStorage.removeItem('rkStudioAuthenticated');
    sessionStorage.removeItem('rkStudioUserId');
    sessionStorage.removeItem('rkStudioAuthProvider');
    applyUI();
    showLogin();
  }
})();

function handleCompanyLogo(ev){
 const file=ev.target.files&&ev.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=function(){
  const img=new Image();
  img.onload=function(){
   const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height));
   const cv=document.createElement('canvas');
   cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));
   cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
   db.settings.companyLogo=cv.toDataURL('image/png');
   save();renderSettings();
  };
  img.src=reader.result;
 };
 reader.readAsDataURL(file);
}

<script id="mobile-scroll-header-script">
(function(){
  function init(){
    if(window.innerWidth > 900) return;
    var lastY=window.scrollY||0, ticking=false;
    function targets(){
      return document.querySelector('.topbar, .mobile-topbar, header.topbar');
    }
    function update(){
      var y=window.scrollY||0, diff=y-lastY;
      if(Math.abs(diff)>4){
        if(diff>0 && y>60) document.body.classList.add('mobile-header-hidden');
        else if(diff<0) document.body.classList.remove('mobile-header-hidden');
        lastY=y;
      }
      ticking=false;
    }
    window.addEventListener('scroll',function(){
      if(!ticking){ window.requestAnimationFrame(update); ticking=true; }
    },{passive:true});
    window.addEventListener('resize',function(){
      if(window.innerWidth>900) document.body.classList.remove('mobile-header-hidden');
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();

(function(){
  const isMobile=()=>window.matchMedia("(max-width: 768px)").matches;
  let lastY=window.scrollY||0;
  let ticking=false;
  function getHeader(){
    return document.querySelector(".mobile-header,.mobile-topbar,.topbar-mobile,header.mobile-header");
  }
  function handle(){
    ticking=false;
    const h=getHeader();
    if(!h)return;
    if(!isMobile()){h.classList.remove("rk-hide-on-scroll");return;}
    const y=window.scrollY||0;
    const d=y-lastY;
    if(y<16 || d<0) h.classList.remove("rk-hide-on-scroll");
    else if(d>2) h.classList.add("rk-hide-on-scroll");
    lastY=y;
  }
  window.addEventListener("scroll",()=>{
    if(ticking)return;
    ticking=true;
    requestAnimationFrame(handle);
  },{passive:true});
  window.addEventListener("resize",handle);
})();


function customerPaymentsTotal(cid){
  return (db.payments||[]).filter(p=>p.customerId==cid && Number(p.amount)>0).reduce((s,p)=>s+Number(p.amount||0),0);
}
function customerInvoices(cid){
  return (db.invoices||[]).filter(i=>i.customerId==cid);
}
function customerRevenue(cid){
  return customerInvoices(cid).reduce((s,i)=>s+Number(i.total||0),0);
}
function customerBalance(cid){
  return Math.max(0,customerRevenue(cid)-customerPaymentsTotal(cid));
}
function customerStatus(cid){
  const total=customerRevenue(cid), paid=customerPaymentsTotal(cid);
  if(!total)return "No Bill";
  if(paid>=total)return "Paid";
  if(paid>0)return "Partially Paid";
  return "Unpaid";
}

    pkg=(db.packages||[]).find(p=>p.name===packageName || p.id===packageName);
  }
  const events=(db.events||[]).filter(e=>e.customerId==customerId).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

function rkCustomerPackage(customer, invoice){
  const pkgs=Array.isArray(db.packages)?db.packages:[];
  const invoicePackageId=invoice?.packageId||"";
  if(invoicePackageId){
    const byId=pkgs.find(p=>String(p.id)===String(invoicePackageId));
    if(byId) return byId;
  }
  const val=String(customer?.package||"").trim();
  if(val){
    const byCustomer=pkgs.find(p=>String(p.id)===val||String(p.name)===val);
    if(byCustomer) return byCustomer;
  }
  const items=Array.isArray(invoice?.items)?invoice.items:[];
  const candidate=items.find(x=>/package/i.test(String(x.desc||"")));
  if(candidate){
    const desc=String(candidate.desc||"").replace(/\s*—\s*Extra.*$/i,"").replace(/\s+Package$/i,"").trim();
    return pkgs.find(p=>String(p.name).toLowerCase()===desc.toLowerCase())||null;
  }
  return null;
}

function paymentAlertInfo(invoice,today){
  const balance=Math.max(0,Number(invoice.total||0)-Number(invoice.paid||0));
  const due=invoice.dueDate||'';
  if(!balance) return {balance,due,days:null,status:'Paid',rank:99};
  if(!due) return {balance,due,days:null,status:'Pending',rank:4};
  const days=Math.round((new Date(due+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
  if(days<0) return {balance,due,days,status:'Overdue',rank:0};
  if(days===0) return {balance,due,days,status:'Due Today',rank:1};
  if(days<=7) return {balance,due,days,status:'Due Soon',rank:2};
  return {balance,due,days,status:'Upcoming',rank:3};
}
function paymentAlertBadge(info){
  if(info.status==='Overdue') return '<span class="status-badge unpaid">🔴 Overdue</span>';
  if(info.status==='Due Today') return '<span class="status-badge unpaid">🟠 Due Today</span>';
  if(info.status==='Due Soon') return '<span class="status-badge partially-paid">🟡 Due Soon</span>';
  if(info.status==='Upcoming') return '<span class="status-badge">🟢 Upcoming</span>';
  return '<span class="status-badge">Pending</span>';
}
function paymentAlertRows(){
  const today=new Date().toISOString().slice(0,10);
  return (db.invoices||[]).map(i=>{const info=paymentAlertInfo(i,today);return {i,...info};}).filter(x=>x.balance>0)
    .sort((a,b)=>a.rank-b.rank || (a.due||'9999').localeCompare(b.due||'9999') || b.balance-a.balance);
}

  };
}
